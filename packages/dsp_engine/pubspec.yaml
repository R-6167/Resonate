name: dsp_engine
description: Ultra-low-latency DSP ENGINE Flutter bindings (FFI + Android NDK).
version: 0.4.0
homepage: https://github.com/R-6167/Resonate/tree/Wire_dsp_engine

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.aetherion.dsp_engine
        pluginClass: DspEnginePlugin
