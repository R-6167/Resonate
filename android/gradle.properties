org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
android.builtInKotlin=false
android.newDsl=false
# AAPT2 was crashing on ic_launcher.png during mergeReleaseResources in CI.
# Disable PNG crunch so AAPT2 does not re-encode these bitmaps.
android.enablePngCrunchInRelease=false
org.gradle.workers.max=2
