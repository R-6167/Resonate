plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.example.resonate'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.resonate'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
