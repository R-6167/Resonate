name: resonate
description: Resonate — local-first offline music player and companion by innotrepid.
publish_to: "none"
version: 0.1.5+6

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.5
  audio_service: ^0.18.19
  audio_session: ^0.1.25
  flutter_volume_controller: ^2.0.2
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  ffi: ^2.1.0
  # Native 64-bit DSP ENGINE (DVC). Library only — app id stays com.aetherion.resonate
  dsp_engine:
    git:
      url: https://github.com/innotrepid/DSP-ENGINE.git
      path: bindings/flutter/dsp_engine
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/resonate_in_app_logo.png
    - assets/branding/resonate_app_icon.png
    - assets/sfx/
