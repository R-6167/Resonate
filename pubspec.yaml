name: resonate
description: A feature-rich offline music player built with Flutter.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  google_fonts: ^6.3.2
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.46
  audio_service: ^0.18.19
  audio_session: ^0.1.25
  flutter_volume_controller: ^2.0.2
  sqflite: ^2.4.2
  path: ^1.9.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
