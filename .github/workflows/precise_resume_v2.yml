name: Precise resume v2
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/precise_resume_v2.py"
jobs:
  resume:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modes_lab
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 tools/precise_resume_v2.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "feat(modes): precise resume thresholds + auto-resume in Podcast/Audiobook"
          git push origin modes_lab
