name: Fix build 961
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/fix_build_961.py"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modes_lab
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 tools/fix_build_961.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "fix(build): mode.id extension import + canContinueListening"
          git push origin modes_lab
