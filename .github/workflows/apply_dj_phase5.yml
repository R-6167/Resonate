name: Apply DJ Phase 5 transition
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_dj_phase5.yml'
      - 'tools/apply_dj_phase5_transition.py'
      - 'tools/apply_dj_idle_stale.py'
      - 'lib/services/dj_transition_planner.dart'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - name: Apply Phase 5 patches
        run: |
          set -euo pipefail
          python3 tools/apply_dj_phase5_transition.py
          python3 tools/apply_dj_idle_stale.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/providers/music_provider.dart lib/services/dj_idle_analysis_service.dart
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feat(dj): Phase 5 — strategy-based handoff + idle stale re-analysis"
            git push origin HEAD:dj_Mode
          fi
