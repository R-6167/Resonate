name: Harden crossfade outgoing fade
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/harden_crossfade.yml'
      - 'tools/apply_crossfade_harden.py'
permissions:
  contents: write
concurrency:
  group: harden-crossfade
  cancel-in-progress: true
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Resonate_Remake
          fetch-depth: 5
      - name: Apply outgoing crossfade harden
        run: |
          set -euo pipefail
          python3 tools/apply_crossfade_harden.py
          grep -q startMarginMs lib/providers/music_provider.dart
          grep -q remainingMs lib/providers/music_provider.dart
          grep -q lastOut lib/providers/music_provider.dart
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/providers/music_provider.dart
          git commit -m "fix: harden crossfade outgoing volume ramp (no sudden cut)" || true
          git push origin HEAD:Resonate_Remake
          git rm -f .github/workflows/harden_crossfade.yml tools/apply_crossfade_harden.py || true
          git commit -m "chore: remove crossfade harden workflow" || true
          git push origin HEAD:Resonate_Remake || true
