name: Port DSP v0.4 from Wire_dsp_engine
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/port_dsp_v04_from_wire.yml"
      - "tools/port_dsp_v04_from_wire.sh"
jobs:
  port:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modes_on_dj_v2
          fetch-depth: 0

      - name: Import v0.4 tree from Wire_dsp_engine
        run: |
          set -e
          git fetch origin Wire_dsp_engine --depth=1
          # Package + root native sources as shipped on Wire
          git checkout origin/Wire_dsp_engine -- \
            packages/dsp_engine \
            include/dsp_engine.h \
            src/dsp_engine_core.cpp \
            src/dsp_stress.cpp \
            docs/DSP_STABILIZATION.md \
            docs/DSP_TRUE_PEAK.md \
            docs/DSP_BASS_STRESS.md || true
          # Ensure paths exist after partial checkout
          test -f include/dsp_engine.h
          test -f src/dsp_engine_core.cpp
          test -d packages/dsp_engine
          # Live app process path (AudioProcessor / JNI)
          cp -f include/dsp_engine.h android/app/src/main/cpp/dsp_engine.h
          cp -f src/dsp_engine_core.cpp android/app/src/main/cpp/dsp_engine_core.cpp
          cp -f src/dsp_stress.cpp android/app/src/main/cpp/dsp_stress.cpp
          echo "Imported DSP ENGINE v0.4 sources"

      - name: Patch pubspec JNI bridge
        run: bash tools/port_dsp_v04_from_wire.sh

      - name: Commit
        run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "feat(dsp): ENGINE v0.4 process path from Wire_dsp_engine"
          git push origin modes_on_dj_v2
