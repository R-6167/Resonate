name: Restore Home step 4
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/restore_home_step4.py"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 0
      - run: python3 tools/restore_home_step4.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add lib/screens/home_screen.dart
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "fix(ui): restore full glass Home (step 4)"
          git pull --rebase origin dj_Mode || true
          git push origin dj_Mode
