name: Add DJ SFX sample pack
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/add_dj_sfx_sample_pack.py'
      - '.github/workflows/add_dj_sfx_sample_pack.yml'
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 0
      - run: python3 tools/add_dj_sfx_sample_pack.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo no changes; else
            git commit -m "feat(dj): sample pack (airhorn, gunshot, vinyl, rewind, whoosh, impact) + one-shot rack"
            git pull --rebase origin dj_Mode
            git push origin HEAD:dj_Mode
          fi
