name: Apply AudioLevelingSettings wire

on:
  workflow_dispatch:
  push:
    branches: [refactor/audio-leveling-settings]
    paths:
      - "tool/patches/audio_leveling_settings_wire.patch"
      - ".github/workflows/apply-audio-leveling-settings.yml"
      - "lib/playback/audio_leveling_settings.dart"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/audio-leveling-settings
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply wire patch
        run: |
          set -euo pipefail
          if grep -q "AudioLevelingSettings _levelingSettings" lib/providers/music_provider.dart; then
            echo "Already wired"
            exit 0
          fi
          patch -p1 --batch --forward < tool/patches/audio_leveling_settings_wire.patch
          grep -q "AudioLevelingSettings _levelingSettings" lib/providers/music_provider.dart
          echo "AudioLevelingSettings wire applied"

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "refactor: wire MusicProvider to AudioLevelingSettings"
          file_pattern: lib/providers/music_provider.dart
          branch: refactor/audio-leveling-settings
