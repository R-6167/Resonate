name: Wire DSP v0.4 JNI connection
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/wire_dsp_v04_jni.py"
      - ".github/workflows/wire_dsp_v04_jni.yml"
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modes_on_dj_v2
          fetch-depth: 1
      - run: python3 tools/wire_dsp_v04_jni.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "fix(dsp): v0.4 preamp/limiter/crossover connected through JNI"
          git push origin HEAD:modes_on_dj_v2
