name: Fix AAPT2 launcher icons
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/fix_aapt2_icons.py"
      - "android/gradle.properties"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow -q && python3 tools/fix_aapt2_icons.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add android/gradle.properties android/app/src/main/res
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "fix(android): clean launcher PNGs + disable PNG crunch for AAPT2"
          git pull --rebase origin dj_Mode || true
          git push origin dj_Mode
