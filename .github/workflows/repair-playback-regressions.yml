name: Repair playback regressions

on:
  push:
    branches: [Companion_Features_Diagnostics]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply surgical repair
        run: python3 .github/repair_regressions.py
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/providers/music_provider.dart lib/providers/listening_history_provider.dart lib/screens/player_screen.dart lib/screens/home_screen.dart lib/screens/intelligence_settings_screen.dart android/app/src/main/kotlin/com/example/resonate/MainActivity.kt
          git rm .github/repair_regressions.py .github/workflows/repair-playback-regressions.yml
          git commit -m "Restore responsive playback and companion UI"
          git push
