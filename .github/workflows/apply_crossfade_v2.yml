name: Apply crossfade harden v2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_crossfade_v2.yml'
      - 'tools/apply_xf.py'
      - 'tools/xfade_maybe.txt'
      - 'tools/xfade_run.txt'
      - 'tools/xfade_remaining.txt'
      - 'tools/xfade_poll.txt'
      - 'tools/xfade_fire.txt'
      - 'tools/xfade_silence.txt'
permissions:
  contents: write
concurrency:
  group: apply-crossfade-v2
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Resonate_Remake
          fetch-depth: 5
      - name: Apply dual-engine crossfade harden
        run: |
          set -euo pipefail
          python3 tools/apply_xf.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/providers/music_provider.dart
          git commit -m "fix: dual-engine crossfade — full 12s equal-power, soft fallback, no hard cut" || true
          git push origin HEAD:Resonate_Remake
