name: Fix repeat dual and sfx v2
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fix_repeat_dual_and_sfx_v2.py'
      - '.github/workflows/fix_repeat_dual_and_sfx_v2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 0
      - run: python3 tools/fix_repeat_dual_and_sfx_v2.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo no changes; else
            git commit -m "feat(playback): dual-engine repeat-one A→B; SFX vinyl/echo/rewind without bass boost"
            git pull --rebase origin dj_Mode
            git push origin HEAD:dj_Mode
          fi
