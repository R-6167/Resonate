name: Install branding assets
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/write_*.py'
      - 'tools/assemble_branding.py'
      - 'tools/install_branding_*.py'
      - '.github/workflows/install_branding.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - name: Write branding assets
        run: |
          set -euo pipefail
          for f in tools/write_*.py tools/install_branding_*.py tools/assemble_branding.py; do
            if [ -f "$f" ]; then python3 "$f" || true; fi
          done
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add assets/branding android/app/src/main/res || true
          if git diff --cached --quiet; then
            echo "no asset changes"
          else
            git commit -m "feat(branding): install app icon + in-app logo assets"
            git push origin HEAD:dj_Mode
          fi
