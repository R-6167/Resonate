name: Wire DJ phrase position
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_dj_phrase_pos.yml'
      - 'tools/apply_dj_phrase_pos.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: |
          set -euo pipefail
          python3 tools/apply_dj_phrase_pos.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/providers/music_provider.dart
          if git diff --cached --quiet; then
            echo "no changes"
            grep -n "outgoingPositionMs\|outPos" lib/providers/music_provider.dart | head || true
          else
            git commit -m "feat(dj): pass outgoing position/duration into transition planner"
            git push origin HEAD:dj_Mode
          fi
