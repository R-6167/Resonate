name: Polish step 4 Home glass
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/polish_step4_home.py"
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 0
      - run: python3 tools/polish_step4_home.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add lib/screens/home_screen.dart
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "ui: glass polish step 4 (Home / For You)"
          git pull --rebase origin dj_Mode || true
          git push origin dj_Mode
