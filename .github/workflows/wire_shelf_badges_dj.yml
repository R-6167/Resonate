name: Wire shelf badges and DJ gate
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/wire_shelf_badges_dj.py"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modes_on_dj_v2
          fetch-depth: 0
      - run: python3 tools/wire_shelf_badges_dj.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "feat: library mode badges, shelf intel card, DJ soft-gate"
          git push origin modes_on_dj_v2
