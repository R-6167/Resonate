name: Harden repeat self and static
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/harden_repeat_self_and_static.py'
      - '.github/workflows/harden_repeat_self_and_static.yml'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 0
      - run: python3 tools/harden_repeat_self_and_static.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo no changes; else
            git commit -m "fix(playback): soft single-engine repeat-one loop; stuck watchdog; anti-static"
            git pull --rebase origin dj_Mode
            git push origin HEAD:dj_Mode
          fi
