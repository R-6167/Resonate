name: Harden silent v2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/harden_silent_v2.yml'
      - 'tools/harden_silent_v2.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: |
          set -euo pipefail
          python3 tools/harden_silent_v2.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/providers/music_provider.dart
          if git diff --cached --quiet; then
            echo "no changes"
            grep -n "playback_volume_unstick\|vol \* 0.85\|crossfade_commit_volume" lib/providers/music_provider.dart | head
          else
            git commit -m "fix(dj): complete silent-playback unstick on finally/commit/recover"
            git push origin HEAD:dj_Mode
          fi
