name: Wire DJ SFX engage
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_dj_sfx_engage.yml'
      - 'tools/apply_dj_sfx_engage.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: |
          set -euo pipefail
          python3 tools/apply_dj_sfx_engage.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/providers/music_provider.dart
          if git diff --cached --quiet; then
            echo "no changes"
            grep -n "_engageDjTransitionSfx\|_restoreDjTransitionSfx" lib/providers/music_provider.dart | head
          else
            git commit -m "feat(dj): engage/restore soft transition SFX around crossfade"
            git push origin HEAD:dj_Mode
          fi
