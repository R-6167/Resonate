name: Fix build syntax Sep26
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fix_build_syntax_sep26.py'
      - '.github/workflows/fix_build_syntax_sep26.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 0
      - run: python3 tools/fix_build_syntax_sep26.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo no changes; else
            git commit -m "fix: repair self-handoff debugPrint and duplicate BPM merge"
            git pull --rebase origin dj_Mode
            git push origin HEAD:dj_Mode
          fi
