name: Repair volume path

on:
  push:
    branches: [Companion_Features_Diagnostics]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 .github/repair_volume.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/providers/music_provider.dart
          git rm .github/repair_volume.py .github/workflows/repair-volume.yml
          git commit -m "Keep system volume independent from player gain"
          git push
