name: Repair playback core

on:
  push:
    branches: [Companion_Features_Diagnostics]
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Companion_Features_Diagnostics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply playback repairs
        run: |
          python3 <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1))
          replace('lib/providers/music_provider.dart', "import '../services/library_visibility_store.dart';", "import '../services/library_visibility_store.dart';\nimport '../services/audio_effects_bridge.dart';")
          replace('lib/providers/music_provider.dart', "      await _syncSystemVolume();\n      if (!const ['linear', 'ease_in', 'ease_out', 'ease_in_out'].contains(_crossfadeFadeType)) _crossfadeFadeType = 'linear';", "      await _syncSystemVolume();\n      await syncSavedAudioEffects();\n      if (!const ['linear', 'ease_in', 'ease_out', 'ease_in_out'].contains(_crossfadeFadeType)) _crossfadeFadeType = 'linear';")
          p=Path('lib/providers/music_provider.dart'); s=p.read_text(); marker='  Future<void> _configureAudioSession() async {'
          helper=r'''  Future<void> syncSavedAudioEffects() async {
            try {
              final prefs=await SharedPreferences.getInstance();
              final enabled=prefs.getBool('equalizer_enabled') ?? true;
              final effectsEnabled=prefs.getBool('effects_enabled') ?? true;
              final bassBoost=prefs.getDouble('bassBoost') ?? 0.0;
              final virtualizer=prefs.getDouble('virtualizer') ?? 0.0;
              final reverb=prefs.getDouble('reverb') ?? 0.0;
              final loudness=prefs.getDouble('loudness') ?? 0.0;
              for (final pair in <(AndroidEqualizer, AndroidLoudnessEnhancer)>[(_equalizerA,_loudnessA),(_equalizerB,_loudnessB)]) {
                final eq=pair.$1; final loud=pair.$2;
                try {
                  final parameters=await eq.parameters;
                  for (final band in parameters.bands) { final saved=prefs.getDouble('eq_band_${band.index}'); if (saved != null) await band.setGain(saved.clamp(parameters.minDecibels,parameters.maxDecibels).toDouble()); }
                  await eq.setEnabled(enabled);
                } catch (_) {}
                try { await loud.setTargetGain(effectsEnabled ? loudness*600.0 : 0.0); await loud.setEnabled(effectsEnabled && loudness>0); } catch (_) {}
              }
              final sessionId=audioPlayer.androidAudioSessionId;
              if (sessionId != null && sessionId > 0) { await AudioEffectsBridge.attachToSession(sessionId); await AudioEffectsBridge.setBassBoost(effectsEnabled ? bassBoost : 0.0); await AudioEffectsBridge.setVirtualizer(effectsEnabled ? virtualizer : 0.0); await AudioEffectsBridge.setReverb(effectsEnabled ? reverb : 0.0); }
            } catch (e) { debugPrint('Saved audio effects sync failed: $e'); }
          }

'''
          if marker not in s: raise SystemExit('MusicProvider marker missing')
          p.write_text(s.replace(marker,helper+marker,1))
          replace('lib/providers/music_provider.dart', "  Future<void> _enableEffects(AudioPlayer player, AndroidEqualizer eq, AndroidLoudnessEnhancer loud) async { try { await eq.setEnabled(true); } catch (e) { debugPrint('Equalizer unavailable: $e'); } try { await loud.setEnabled(true); } catch (e) { debugPrint('Loudness enhancer unavailable: $e'); } }", """  Future<void> _enableEffects(AudioPlayer player, AndroidEqualizer eq, AndroidLoudnessEnhancer loud) async {
            try { await eq.setEnabled(true); } catch (e) { debugPrint('Equalizer unavailable: $e'); }
            try { await loud.setEnabled(true); } catch (e) { debugPrint('Loudness enhancer unavailable: $e'); }
            try {
              final sessionId=player.androidAudioSessionId;
              if (sessionId != null && sessionId > 0) {
                final prefs=await SharedPreferences.getInstance(); final enabled=prefs.getBool('effects_enabled') ?? true;
                await AudioEffectsBridge.attachToSession(sessionId);
                await AudioEffectsBridge.setBassBoost(enabled ? (prefs.getDouble('bassBoost') ?? 0.0) : 0.0);
                await AudioEffectsBridge.setVirtualizer(enabled ? (prefs.getDouble('virtualizer') ?? 0.0) : 0.0);
                await AudioEffectsBridge.setReverb(enabled ? (prefs.getDouble('reverb') ?? 0.0) : 0.0);
              }
              await syncSavedAudioEffects();
            } catch (e) { debugPrint('Audio effects activation failed: $e'); }
          }""")
          replace('lib/providers/music_provider.dart', "      _activeIsA = true;\n      final requested = queue != null && queue.isNotEmpty ? List<Song>.from(queue) : <Song>[song];", "      // Alternate the two owned engines; both receive the same persisted effects.\n      _activeIsA = !_activeIsA;\n      final requested = queue != null && queue.isNotEmpty ? List<Song>.from(queue) : <Song>[song];")
          replace('lib/providers/music_provider.dart', "  Future<void> _advanceAfterCompletion() async {\n    if (_completionAdvanceInProgress) return;\n    _completionAdvanceInProgress = true;", "  Future<void> _advanceAfterCompletion() {\n    if (_completionAdvanceInProgress) return Future<void>.value();\n    return _serializePlayback(() => _advanceAfterCompletionInternal(), command: 'completion_advance', source: 'automatic_transition');\n  }\n\n  Future<void> _advanceAfterCompletionInternal() async {\n    if (_completionAdvanceInProgress) return;\n    _completionAdvanceInProgress = true;")
          replace('lib/providers/autopilot_controller.dart', "    if (!_consentLoaded || !intelligence.isAutopilot || !music.isPlaying || music.currentSong == null) return;\n\n    final automaticQueue = await IntelligenceSettingsStore.automaticQueue();", "    if (!_consentLoaded || !intelligence.isAutopilot || music.currentSong == null) return;\n    if (!music.isPlaying && !forceTransition) return;\n\n    final automaticQueue = await IntelligenceSettingsStore.automaticQueue();")
          replace('lib/providers/library_provider.dart', "  Future<void> loadStatistics() async { try { _statistics = await _db.getStatistics(); notifyListeners(); } catch (e) { debugPrint('Error loading statistics: $e'); } }", """  Future<void> loadStatistics() async {
            try {
              final raw=await _db.getStatistics(); _statistics=Map<String,dynamic>.from(raw);
              _statistics['totalSongs']=_allSongs.length; _statistics['favoriteCount']=_favoriteSongs.length; notifyListeners();
            } catch (e) { debugPrint('Error loading statistics: $e'); }
          }""")
          replace('lib/providers/equalizer_provider.dart', "  EqualizerProvider({AndroidEqualizer? equalizer}) : _androidEqualizer = equalizer { _initialize(); }", "  final Future<void> Function()? onSettingsChanged;\n  EqualizerProvider({AndroidEqualizer? equalizer, this.onSettingsChanged}) : _androidEqualizer = equalizer { _initialize(); }")
          replace('lib/providers/equalizer_provider.dart', "  Future<void> setBandGain(int index, double gain) async { final matches = bandStates.where((band) => band.index == index); if (matches.isEmpty) return; final match = matches.first; match.gain = gain.clamp(match.minGain, match.maxGain).toDouble(); bands[_labelForFrequency(match.centerFrequency)] = match.gain; preset = 'Custom'; await _setNativeBand(match); await _save(); notifyListeners(); }", "  Future<void> setBandGain(int index, double gain) async { final matches = bandStates.where((band) => band.index == index); if (matches.isEmpty) return; final match = matches.first; match.gain = gain.clamp(match.minGain, match.maxGain).toDouble(); bands[_labelForFrequency(match.centerFrequency)] = match.gain; preset = 'Custom'; await _setNativeBand(match); await _save(); if (onSettingsChanged != null) await onSettingsChanged!(); notifyListeners(); }")
          replace('lib/providers/equalizer_provider.dart', "  Future<void> setEnabled(bool value) async { isEnabled = value; try { await _androidEqualizer?.setEnabled(value); } catch (e) { debugPrint('Equalizer enable failed: $e'); } await _save(); notifyListeners(); }", "  Future<void> setEnabled(bool value) async { isEnabled = value; try { await _androidEqualizer?.setEnabled(value); } catch (e) { debugPrint('Equalizer enable failed: $e'); } await _save(); if (onSettingsChanged != null) await onSettingsChanged!(); notifyListeners(); }")
          replace('lib/providers/equalizer_provider.dart', "  Future<void> setPreamp(double value) async { preamp = value.clamp(-12.0, 6.0).toDouble(); await _save(); notifyListeners(); }", "  Future<void> setPreamp(double value) async { preamp = value.clamp(-12.0, 6.0).toDouble(); await _save(); if (onSettingsChanged != null) await onSettingsChanged!(); notifyListeners(); }")
          replace('lib/main.dart', "ChangeNotifierProvider(create: (context) => EqualizerProvider(equalizer: context.read<MusicProvider>().equalizer)),", """ChangeNotifierProvider(create: (context) => EqualizerProvider(
      equalizer: context.read<MusicProvider>().equalizer,
      onSettingsChanged: context.read<MusicProvider>().syncSavedAudioEffects,
    )),""")
          PY
      - name: Format and verify
        run: |
          dart format lib/providers/music_provider.dart lib/providers/autopilot_controller.dart lib/providers/library_provider.dart lib/providers/equalizer_provider.dart lib/main.dart
          git diff --check
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/providers/music_provider.dart lib/providers/autopilot_controller.dart lib/providers/library_provider.dart lib/providers/equalizer_provider.dart lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix: stabilize playback effects autopilot and scoped stats"
          git push origin HEAD:Companion_Features_Diagnostics
