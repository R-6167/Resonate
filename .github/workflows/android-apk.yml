name: Resonate CI

on:
  push:
    branches: [Resonate-True-Apk, media3-main-engine, media3-music-provider-cutover, media3-gain-policy, media3-queue-index-safety, media3-provider-state-contract, media3-queue-occurrence-safety]
  pull_request:
    branches: [Resonate-True-Apk, media3-native-engine, media3-main-engine, media3-music-provider-cutover, media3-gain-policy, media3-queue-index-safety, media3-provider-state-contract]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resonate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate DSP, Flutter, and Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Patch just_audio DSP sink
        run: python3 scripts/patch_just_audio_dsp_sink.py

      - name: Verify just_audio DSP sink injection
        run: python3 scripts/patch_just_audio_dsp_sink.py --check

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Native DSP compile and stress test
        run: ./scripts/test_native_dsp.sh

      - name: Android DSP unit tests
        run: cd android && ./gradlew testDebugUnitTest

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release APK and enforce size budget
        run: python3 scripts/verify_release_apk.py

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: resonate-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
