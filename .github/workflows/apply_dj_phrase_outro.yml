name: Apply DJ phrase/outro
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_dj_phrase_outro.yml'
      - 'tools/apply_dj_phrase_outro.py'
      - 'lib/services/dj_transition_planner.dart'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: |
          set -euo pipefail
          python3 tools/apply_dj_phrase_outro.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/services/dj_bpm_estimator.dart lib/providers/music_provider.dart
          if git diff --cached --quiet; then
            echo "no changes"
            grep -n "computePhraseAlignedSeekMs\|outgoingPositionMs" lib/services/dj_bpm_estimator.dart lib/providers/music_provider.dart || true
          else
            git commit -m "feat(dj): phrase-grid seek + position-aware handoff for outro/phrase strategies"
            git push origin HEAD:dj_Mode
          fi
