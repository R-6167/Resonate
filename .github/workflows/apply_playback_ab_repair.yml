name: Apply Playback A-B Repair

on:
  push:
    branches:
      - Companion_Features_Diagnostics

permissions:
  contents: write

jobs:
  repair:
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Companion_Features_Diagnostics
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply source repair
        run: python scripts/repair_playback_ab.py
      - name: Replace coordinator with valid Dart source
        run: |
          cat > lib/services/playback_coordinator.dart <<'EOF'
          import 'dart:async';

          /// Serializes native source mutations while allowing the newest source request
          /// to supersede requests that have not started yet. This prevents a burst of
          /// taps from becoming a long FIFO backlog while preserving the one-at-a-time
          /// native source mutation boundary.
          class PlaybackCoordinator {
            Future<void> _sourceTail = Future<void>.value();
            int _operationId = 0;
            int _latestSourceRequest = 0;

            int get lastOperationId => _operationId;

            Future<T> runSourceMutation<T>(
              Future<T> Function() operation, {
              required String command,
              bool supersedePending = false,
              Future<T> Function()? onSuperseded,
            }) {
              final id = ++_operationId;
              if (supersedePending) _latestSourceRequest = id;
              final next = _sourceTail.then((_) async {
                if (supersedePending && id != _latestSourceRequest) {
                  if (onSuperseded != null) return onSuperseded();
                  return operation();
                }
                return operation();
              });
              _sourceTail = next.then<void>((_) {}, onError: (_, __) {});
              return next;
            }

            Future<T> runTransport<T>(Future<T> Function() operation) => operation();

            Future<void> drain() => _sourceTail;

            void reset() {
              _sourceTail = Future<void>.value();
              _latestSourceRequest = _operationId;
            }
          }
          EOF
      - name: Validate repaired source
        run: |
          test "$(grep -c "final PlaybackCoordinator _playbackCoordinator = PlaybackCoordinator();" lib/providers/music_provider.dart)" -ge 1
          test "$(grep -c "late final AudioEffectsController _audioEffectsController;" lib/providers/music_provider.dart)" -ge 1
          ! grep -q "Future<void> _playOperation" lib/providers/music_provider.dart
          grep -q "targetIsA = firstLoad ? true : !_activeIsA" lib/providers/music_provider.dart
          grep -q "supersedePending: userInitiated" lib/providers/music_provider.dart
          grep -q "class PlaybackCoordinator" lib/services/playback_coordinator.dart
          ! grep -q "_fallbackPlayer" lib/services/audio_service_handler.dart
      - name: Remove one-shot repair files
        run: rm -f scripts/repair_playback_ab.py .github/workflows/apply_playback_ab_repair.yml
      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/providers/music_provider.dart lib/services/playback_coordinator.dart scripts/repair_playback_ab.py .github/workflows/apply_playback_ab_repair.yml
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix: alternate playback engines and coalesce stale source requests'
          git push origin HEAD:Companion_Features_Diagnostics
