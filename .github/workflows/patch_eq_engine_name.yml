name: Patch EQ engine display name
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_eq_engine_display_name.py'
      - '.github/workflows/patch_eq_engine_name.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: python3 tools/patch_eq_engine_display_name.py
      - run: |
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/providers/equalizer_provider.dart
          if git diff --cached --quiet; then echo no changes; else
            git commit -m "fix(eq): dspEngineId = Resonate DSP Engine"
            git push origin HEAD:dj_Mode
          fi
