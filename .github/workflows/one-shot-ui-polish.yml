name: One-shot UI Polish

on:
  push:
    branches:
      - Companion_Features_Diagnostics

jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/screens/player_screen.dart')
          text = p.read_text()
          text = text.replace("import 'dart:math' as math;", "import 'dart:math' as math;\nimport 'dart:ui' as ui;")
          start = text.index('  Future<void> _showMoreOptions(BuildContext context) async {')
          end = text.index('  Future<void> _showSpeed(', start)
          method = '''  Future<void> _showMoreOptions(BuildContext context) async {
    final playback = context.read<PlaybackFeaturesProvider>();
    final eq = context.read<EqualizerProvider>();
    final effects = context.read<AudioEffectsProvider>();

    await showGeneralDialog<void>(
      context: context,
      barrierDismissible: true,
      barrierLabel: 'More options',
      barrierColor: Colors.black26,
      transitionDuration: const Duration(milliseconds: 260),
      pageBuilder: (dialogContext, animation, secondaryAnimation) {
        return SafeArea(
          child: Center(
            child: BackdropFilter(
              filter: ui.ImageFilter.blur(sigmaX: 9, sigmaY: 9),
              child: Material(
                color: Theme.of(context).colorScheme.surface.withOpacity(.96),
                elevation: 12,
                borderRadius: BorderRadius.circular(28),
                clipBehavior: Clip.antiAlias,
                child: ConstrainedBox(
                  constraints: const BoxConstraints(maxWidth: 520),
                  child: SingleChildScrollView(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const SizedBox(height: 8),
                        ListTile(
                          leading: const Icon(Icons.drag_handle_rounded),
                          title: const Text('More options'),
                          subtitle: const Text('Playback, sound and session controls'),
                          trailing: IconButton(
                            icon: const Icon(Icons.close_rounded),
                            onPressed: () => Navigator.pop(dialogContext),
                          ),
                        ),
                        ListTile(
                          leading: const Icon(Icons.equalizer_rounded),
                          title: const Text('Equalizer'),
                          subtitle: Text(eq.isEnabled ? eq.preset : 'Disabled'),
                          onTap: () {
                            Navigator.pop(dialogContext);
                            Navigator.push(context, MaterialPageRoute(builder: (_) => const EqualizerScreen()));
                          },
                        ),
                        ListTile(
                          leading: const Icon(Icons.auto_awesome_rounded),
                          title: const Text('Audio effects'),
                          subtitle: Text(effects.effectsEnabled ? 'Bass, width, reverb and loudness' : 'Disabled'),
                          onTap: () {
                            Navigator.pop(dialogContext);
                            Navigator.push(context, MaterialPageRoute(builder: (_) => const AudioEffectsScreen()));
                          },
                        ),
                        ListTile(
                          leading: const Icon(Icons.speed_rounded),
                          title: const Text('Playback speed'),
                          trailing: Text('${playback.speed.toStringAsFixed(2)}×'),
                          onTap: () {
                            Navigator.pop(dialogContext);
                            _showSpeed(context, playback);
                          },
                        ),
                        ListTile(
                          leading: const Icon(Icons.tune_rounded),
                          title: const Text('Pitch'),
                          trailing: Text('${playback.pitch.toStringAsFixed(2)}×'),
                          onTap: () {
                            Navigator.pop(dialogContext);
                            _showPitch(context, playback);
                          },
                        ),
                        Consumer<PlaybackFeaturesProvider>(
                          builder: (_, current, __) => SwitchListTile(
                            secondary: const Icon(Icons.volume_down_rounded),
                            title: const Text('Volume normalization'),
                            subtitle: Text('Target ${current.targetLoudness.toStringAsFixed(0)} LUFS • track gain when available'),
                            value: current.normalizationEnabled,
                            onChanged: current.setNormalizationEnabled,
                          ),
                        ),
                        ListTile(
                          leading: const Icon(Icons.timer_outlined),
                          title: const Text('Sleep timer'),
                          trailing: Text(playback.sleepTimerLabel),
                          onTap: () {
                            Navigator.pop(dialogContext);
                            _showSleepTimer(context, playback);
                          },
                        ),
                        const SizedBox(height: 10),
                      ],
                    ),
                  ),
                ),
              ),
            ),
          ),
        );
      },
      transitionBuilder: (context, animation, secondaryAnimation, child) {
        final curved = CurvedAnimation(parent: animation, curve: Curves.easeOutCubic);
        return FadeTransition(
          opacity: curved,
          child: ScaleTransition(
            scale: Tween<double>(begin: .92, end: 1).animate(curved),
            child: child,
          ),
        );
      },
    );
  }

'''
          text = text[:start] + method + text[end:]
          text = text.replace("Timer(const Duration(milliseconds: 1200), _run)", "Timer(const Duration(milliseconds: 1600), _run)")
          text = text.replace("duration: const Duration(milliseconds: 3200)", "duration: const Duration(milliseconds: 5200)")
          text = text.replace("Future<void>.delayed(const Duration(milliseconds: 900))", "Future<void>.delayed(const Duration(milliseconds: 1400))")
          p.write_text(text)

          h = Path('lib/screens/home_screen.dart')
          text = h.read_text()
          text = text.replace("Opacity(opacity: .07, child: Text('RESONATE'", "Opacity(opacity: .13, child: Text('RESONATE'")
          text = text.replace("AnimatedSwitcher(duration: const Duration(milliseconds: 420)", "AnimatedSwitcher(duration: const Duration(milliseconds: 650)")
          h.write_text(text)
          PY
      - name: Commit UI polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/player_screen.dart lib/screens/home_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish player options and companion motion"
          git push
