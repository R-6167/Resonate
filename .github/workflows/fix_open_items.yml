name: Fix remaining open items
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/fix_open_items_sfx_session_eq.py"
      - "lib/dj_engine/execution/dj_execution_planner.dart"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_engine_v2
          fetch-depth: 0
      - run: python3 tools/fix_open_items_sfx_session_eq.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "fix: oneshot duck, phrase-snap SFX, honest MediaSession, EQ re-apply"
          git push origin dj_engine_v2
