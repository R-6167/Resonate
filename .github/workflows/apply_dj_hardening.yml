name: Apply DJ diagnostics hardening
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_dj_hardening.yml'
      - 'tools/apply_record_dj.py'
      - 'tools/apply_dj_continuity.py'
      - 'tools/apply_dj_hardening_mp.py'
permissions:
  contents: write
concurrency:
  group: apply-dj-hardening
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 5
      - name: Apply hardening patches
        run: |
          set -euo pipefail
          python3 tools/apply_record_dj.py || true
          python3 tools/apply_dj_continuity.py || true
          python3 tools/apply_dj_hardening_mp.py || true
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/services/resonate_diagnostics.dart lib/services/intelligence_decision_engine.dart lib/providers/music_provider.dart || true
          git commit -m "feat(dj): diagnostics parity, continuity scoring, recordDj on handoffs" || true
          git push origin HEAD:dj_Mode
