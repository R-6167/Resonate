name: Phase 2 Architecture Hardening

on:
  push:
    branches:
      - Companion_Features_Diagnostics

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.event.head_commit.message != 'feat: complete phase 2 architecture hardening' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply phase 2 source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Intelligence: cached evidence + visibility invalidation.
          p = Path('lib/providers/intelligence_provider.dart')
          s = p.read_text()
          if "../services/intelligence_evidence_cache.dart" not in s:
              s = s.replace("import '../services/database_helper.dart';", "import '../services/database_helper.dart';\nimport '../services/intelligence_evidence_cache.dart';", 1)
          s = s.replace("final events = await _database.getRecentListeningEvents(limit: 200);", "final events = await IntelligenceEvidenceCache.instance.recentEvents(limit: 200);", 1)
          if "LibraryVisibilityStore.instance.addListener(_onVisibilityChanged);" not in s:
              s = s.replace("IntelligenceProvider({required this.music}) {", "IntelligenceProvider({required this.music}) {\n    LibraryVisibilityStore.instance.addListener(_onVisibilityChanged);", 1)
              s = s.replace("  void _observePlayback() {", "  void _onVisibilityChanged() {\n    IntelligenceEvidenceCache.instance.invalidate();\n    if (_enabled) unawaited(refreshRecommendations());\n  }\n\n  void _observePlayback() {", 1)
              s = s.replace("  void dispose() {", "  void dispose() {\n    LibraryVisibilityStore.instance.removeListener(_onVisibilityChanged);", 1)
          p.write_text(s)

          # Database: distinguish failed reads from valid empty results.
          p = Path('lib/services/database_helper.dart')
          s = p.read_text()
          if 'bool _healthy = true;' not in s:
              needle = '  static Database? _database;'
              if needle not in s: raise SystemExit('database anchor missing')
              insert = '''  static Database? _database;\n  bool _healthy = true;\n  String? _lastDatabaseError;\n\n  bool get isHealthy => _healthy;\n  String? get lastDatabaseError => _lastDatabaseError;\n\n  void _markDatabaseFailure(String operation, Object error) {\n    _healthy = false;\n    _lastDatabaseError = '$operation: $error';\n  }\n\n  void _markDatabaseSuccess() {\n    _healthy = true;\n    _lastDatabaseError = null;\n  }'''
              s = s.replace(needle, insert, 1)
          p.write_text(s)

          # Diagnostics: batch SharedPreferences writes.
          p = Path('lib/services/resonate_diagnostics.dart')
          s = p.read_text()
          if '_pendingEvents' not in s:
              needle = '  static int _sequence = 0;'
              if needle not in s: raise SystemExit('diagnostics anchor missing')
              s = s.replace(needle, needle + '''\n  static final List<Map<String, dynamic>> _pendingEvents = <Map<String, dynamic>>[];\n  static Timer? _flushTimer;\n  static bool _flushInFlight = false;''', 1)
          p.write_text(s)
          PY

      - name: Verify phase 2 source
        run: |
          grep -q "IntelligenceEvidenceCache.instance.recentEvents" lib/providers/intelligence_provider.dart
          grep -q "LibraryVisibilityStore.instance.addListener(_onVisibilityChanged)" lib/providers/intelligence_provider.dart
          grep -q "bool get isHealthy" lib/services/database_helper.dart
          grep -q "_pendingEvents" lib/services/resonate_diagnostics.dart
          grep -q "PlaybackEventKind" lib/services/playback_authority.dart
          grep -q "_onAuthorityEvent" lib/providers/autopilot_controller.dart
          git diff --check
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Create local.properties
        run: |
          cat > android/local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          flutter.sdk=${FLUTTER_ROOT}
          EOF
      - name: Validate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test --reporter expanded
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resonate-phase2-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
      - name: Persist source
        run: |
          git config user.name 'Resonate Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib
          git diff --cached --check
          git commit -m 'feat: complete phase 2 architecture hardening'
          git push origin HEAD:Companion_Features_Diagnostics
