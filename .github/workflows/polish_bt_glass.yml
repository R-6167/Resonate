name: Polish BT glass
on:
  workflow_dispatch:
  push:
    paths: ["tools/polish_bt_glass.py"]
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: dj_Mode, fetch-depth: 0 }
      - run: python3 tools/polish_bt_glass.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add lib/screens/settings_screen.dart
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "ui: glass Bluetooth device controls"
          git pull --rebase origin dj_Mode || true
          git push origin dj_Mode
