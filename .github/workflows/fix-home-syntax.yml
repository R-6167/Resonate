name: Fix Home Syntax

on:
  push:
    branches:
      - Companion_Features_Diagnostics

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair home screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/home_screen.dart')
          s = p.read_text()
          old = """      child: Stack(children: [\n        Positioned(right: -8, bottom: 4, child: IgnorePointer(child: Opacity(opacity: .07, child: Text('RESONATE', style: TextStyle(fontSize: 48, fontWeight: FontWeight.w900, letterSpacing: 3))))),\n        Column(crossAxisAlignment: CrossAxisAlignment.start, children: [\n"""
          new = """      child: Stack(\n        children: [\n          Positioned(\n            right: -8,\n            bottom: 4,\n            child: IgnorePointer(\n              child: Opacity(\n                opacity: .11,\n                child: Text(\n                  'RESONATE',\n                  style: const TextStyle(\n                    fontSize: 48,\n                    fontWeight: FontWeight.w900,\n                    letterSpacing: 3,\n                  ),\n                ),\n              ),\n            ),\n          ),\n          Column(\n            crossAxisAlignment: CrossAxisAlignment.start,\n            children: [\n"""
          if old not in s:
              raise SystemExit('expected malformed Stack/Column prefix not found')
          s = s.replace(old, new, 1)
          old2 = """              AnimatedSwitcher(duration: const Duration(milliseconds: 420), transitionBuilder: (child, animation) => RotationTransition(turns: Tween(begin: .88, end: 1.0).animate(animation), child: FadeTransition(opacity: animation, child: child)), child: Icon(intelligence.isAutopilot ? Icons.smart_toy_rounded : Icons.auto_awesome, key: ValueKey(intelligence.autonomyLabel))),\n"""
          new2 = """              AnimatedSwitcher(\n                duration: const Duration(milliseconds: 520),\n                transitionBuilder: (child, animation) => RotationTransition(\n                  turns: Tween(begin: .88, end: 1.0).animate(animation),\n                  child: FadeTransition(opacity: animation, child: child),\n                ),\n                child: Icon(\n                  intelligence.isAutopilot\n                      ? Icons.smart_toy_rounded\n                      : Icons.auto_awesome,\n                  key: ValueKey(intelligence.autonomyLabel),\n                ),\n              ),\n"""
          if old2 not in s:
              raise SystemExit('expected intelligence icon line not found')
          s = s.replace(old2, new2, 1)
          old3 = """        ],\n      ),\n    );\n  }\n}\n\nclass _SessionCard"""
          new3 = """            ],\n          ),\n        ],\n      ),\n    );\n  }\n}\n\nclass _SessionCard"""
          if old3 not in s:
              raise SystemExit('expected malformed Stack closing not found')
          s = s.replace(old3, new3, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/home_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m 'fix: close intelligence hero stack correctly'
          git push
