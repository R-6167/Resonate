name: Apply structure SFX v2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_structure_sfx_v2.yml'
      - 'tools/apply_structure_sfx_v2.py'
      - 'lib/services/dj_sfx_rack.dart'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: |
          set -euo pipefail
          python3 tools/apply_structure_sfx_v2.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add \
            android/app/src/main/kotlin/com/Aetherion/Resonate/MainActivity.kt \
            lib/services/dj_bpm_estimator.dart \
            lib/services/dj_analysis_service.dart \
            lib/services/dj_idle_analysis_service.dart \
            lib/models/dj_analysis.dart \
            lib/providers/music_provider.dart \
            lib/services/dj_sfx_rack.dart
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feat(dj): whole-track structure windows + random multi-preset SFX/EQ sweeps"
            git push origin HEAD:dj_Mode
          fi
