name: Harden silent playback
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/harden_dj_silent_playback.yml'
      - 'tools/harden_dj_silent_playback.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: |
          set -euo pipefail
          python3 tools/harden_dj_silent_playback.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/providers/music_provider.dart
          if git diff --cached --quiet; then
            echo "no changes"
            grep -n "playback_volume_unstick\|silent_watchdog\|crossfade_commit_volume\|userWantsPlaying" lib/providers/music_provider.dart | head
          else
            git commit -m "fix(dj): recover silent playback after crossfade/DJ/SFX"
            git push origin HEAD:dj_Mode
          fi
