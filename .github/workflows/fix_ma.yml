name: Emergency restore MainActivity
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix_ma.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 40
      - run: |
          set -euo pipefail
          git checkout 2be4592d6d7bb13dc9dd3a0a9b0d322d1804fd50 -- android/app/src/main/kotlin/com/Aetherion/Resonate/MainActivity.kt
          wc -l android/app/src/main/kotlin/com/Aetherion/Resonate/MainActivity.kt
          head -5 android/app/src/main/kotlin/com/Aetherion/Resonate/MainActivity.kt
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add android/app/src/main/kotlin/com/Aetherion/Resonate/MainActivity.kt
          git commit -m "fix: restore MainActivity from good commit 2be4592d" || true
          git push origin HEAD:dj_Mode
