name: Polish minor batch
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/polish_minor_batch.py"
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 0
      - run: python3 tools/polish_minor_batch.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "polish: glass BT/viz/companion, drop intel placeholders, wave default, EQ+audio hardening"
          git pull --rebase origin dj_Mode || true
          git push origin dj_Mode
