name: Finish Mode shelf screen
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/finish_mode_shelf.py"
      - "lib/screens/mode_shelf_screen.dart"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modes_on_dj_v2
          fetch-depth: 0
      - run: python3 tools/finish_mode_shelf.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "feat(modes): full Mode shelf screen + navigation entry points"
          git push origin modes_on_dj_v2
