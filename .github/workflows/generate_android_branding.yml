name: Generate Android branding
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/branding/**'
      - 'tools/generate_android_branding.py'
      - '.github/workflows/generate_android_branding.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 tools/generate_android_branding.py
      - name: Commit generated icons
        run: |
          set -euo pipefail
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add android/app/src/main/res
          if git diff --cached --quiet; then
            echo "no icon changes"
            exit 0
          fi
          git commit -m "feat(branding): launcher, splash, notification icons from brand mark"
          git pull --rebase origin dj_Mode
          git push origin HEAD:dj_Mode
