name: Fix DJ clamp int types
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix_dj_build_remaining_ms.yml'
      - 'tools/fix_dj_build_remaining_ms.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: |
          set -euo pipefail
          python3 tools/fix_dj_build_remaining_ms.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/providers/music_provider.dart \
                  lib/services/dj_pcm_bpm.dart \
                  lib/services/dj_transition_planner.dart
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fix(dj): remainingMs/period/thresh clamp → toInt for Dart 3"
            git push origin HEAD:dj_Mode
          fi
