name: Wire mode chip UI
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/wire_mode_chip.py"
      - "lib/widgets/resonate_mode_chip.dart"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modes_on_dj_v2
          fetch-depth: 0
      - run: python3 tools/wire_mode_chip.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "feat(modes): show ResonateModeChip on player and home"
          git push origin modes_on_dj_v2
