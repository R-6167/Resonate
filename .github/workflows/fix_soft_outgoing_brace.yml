name: Fix soft-outgoing brace
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/fix_soft_outgoing_brace.py"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: python3 tools/fix_soft_outgoing_brace.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add lib/providers/music_provider.dart
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "fix: close soft-outgoing try so playSong is a MusicProvider method"
            git push
          fi
