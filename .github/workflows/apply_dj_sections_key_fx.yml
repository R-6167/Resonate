name: Apply DJ sections key FX
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_dj_sections_key_fx.yml'
      - 'tools/apply_dj_sections_key_fx.py'
      - 'lib/services/dj_pcm_features.dart'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: |
          set -euo pipefail
          python3 tools/apply_dj_sections_key_fx.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/services/dj_bpm_estimator.dart \
                  lib/models/dj_analysis.dart \
                  lib/services/dj_analysis_service.dart \
                  lib/services/database_helper.dart \
                  lib/services/dj_transition_planner.dart \
                  lib/providers/music_provider.dart
          if git diff --cached --quiet; then
            echo "no changes"
            grep -n "DjPcmFeatureAnalyzer\|introHintMs\|currentVersion = 4\|mismatch \* 0.28\|outroHintMs" \
              lib/services/dj_bpm_estimator.dart lib/models/dj_analysis.dart \
              lib/providers/music_provider.dart lib/services/dj_transition_planner.dart || true
          else
            git commit -m "feat(dj): wire key-from-signal, section hints, energy-aware FX"
            git push origin HEAD:dj_Mode
          fi
