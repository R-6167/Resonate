name: Write music_provider Step 2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/write_mp_step2.yml'
      - 'tools/write_mp_step2.py'
      - 'tools/mp2_p0.txt'
      - 'tools/mp2_p1.txt'
      - 'tools/mp2_p2.txt'
      - 'tools/mp2_p3.txt'
      - 'tools/mp2_p4.txt'
      - 'tools/mp2_p5.txt'
      - 'tools/mp2_p6.txt'
permissions:
  contents: write
concurrency:
  group: write-mp-step2
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 5
      - name: Write Step 2 music_provider
        run: |
          set -euo pipefail
          python3 tools/write_mp_step2.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/providers/music_provider.dart
          git commit -m "feat(dj): Step 2 beat-aware crossfade handoff in music_provider" || true
          git push origin HEAD:dj_Mode
