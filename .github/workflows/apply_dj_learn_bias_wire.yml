name: Wire DJ learned planner
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_dj_learn_bias_wire.yml'
      - 'tools/apply_dj_learn_bias_wire.py'
      - 'lib/services/dj_transition_planner.dart'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: |
          set -euo pipefail
          python3 tools/apply_dj_learn_bias_wire.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/providers/music_provider.dart
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feat(dj): handoff uses learned soft bias when choosing strategy"
            git push origin HEAD:dj_Mode
          fi
