name: Fix GlassCard color args
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/fix_glass_card_color.py"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 0
      - run: python3 tools/fix_glass_card_color.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add lib/screens/dj_mode_settings_screen.dart lib/screens/player_screen.dart
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "fix(ui): remove invalid color: on ResonateGlassCard"
          git pull --rebase origin dj_Mode || true
          git push origin dj_Mode
