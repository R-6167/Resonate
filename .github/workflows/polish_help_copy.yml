name: Polish help copy
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/polish_help_copy.py'
      - '.github/workflows/polish_help_copy.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 0
      - run: |
          set -euo pipefail
          python3 tools/polish_help_copy.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/screens/equalizer_screen.dart lib/screens/crossfade_screen.dart lib/screens/dj_mode_settings_screen.dart
          if git diff --cached --quiet; then echo no changes; else
            git commit -m "docs: polish EQ, crossfade, and DJ Mode help copy"
            git pull --rebase origin dj_Mode
            git push origin HEAD:dj_Mode
          fi
