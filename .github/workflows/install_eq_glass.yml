name: Install EQ glass + colour effects
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/install_eq_glass.py"
      - "tools/eq_glass_b1.py"
      - "tools/eq_glass_b2.py"
jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: python3 tools/install_eq_glass.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add lib/screens/equalizer_screen.dart
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "ui: Equalizer Colour effects (Bass/Width/Reverb) + Live badge + glass"
            git push
          fi
