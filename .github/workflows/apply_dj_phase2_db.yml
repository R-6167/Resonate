name: Apply DJ Phase 2 DB
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_dj_phase2_db.yml'
      - 'tools/apply_dj_phase2_db.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - name: Apply Phase 2 DB migration
        run: |
          set -euo pipefail
          python3 tools/apply_dj_phase2_db.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/services/database_helper.dart
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feat(dj): Phase 2 — song_dj_analysis v5 (version, source, identity)"
            git push origin HEAD:dj_Mode
          fi
