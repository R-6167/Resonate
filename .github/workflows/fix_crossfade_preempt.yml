name: Fix crossfade preempt
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/fix_crossfade_preempt.py"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_engine_v2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 tools/fix_crossfade_preempt.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "fix(playback): preempt mid-crossfade song taps — no jump-back to B"
          git push origin dj_engine_v2
