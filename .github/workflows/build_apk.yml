name: Build Resonate APK

on:
  workflow_dispatch:
  push:
    branches:
      - Companion_Features_Diagnostics

permissions:
  contents: write

concurrency:
  group: resonate-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'
          cache-read-only: false

      - name: Accept Android SDK licenses and ensure packages
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-not set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not set}"
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if [ -z "$ANDROID_SDK_ROOT" ] || [ ! -d "$ANDROID_SDK_ROOT" ]; then
            echo "No preinstalled Android SDK found – installing cmdline-tools manually"
            mkdir -p $HOME/android-sdk/cmdline-tools
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
            unzip -q /tmp/cmdtools.zip -d $HOME/android-sdk/cmdline-tools
            mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
            export ANDROID_SDK_ROOT=$HOME/android-sdk
            export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
            echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          fi
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" 2>/dev/null || true
          sdkmanager --install "platforms;android-36" 2>/dev/null || \
          sdkmanager --install "platforms;android-35" 2>/dev/null || \
          sdkmanager --install "platforms;android-34" 2>/dev/null || true
          sdkmanager --install "build-tools;36.0.0" 2>/dev/null || \
          sdkmanager --install "build-tools;35.0.0" 2>/dev/null || \
          sdkmanager --install "build-tools;34.0.0" 2>/dev/null || true
          echo "Installed packages (if any):"
          sdkmanager --list_installed 2>/dev/null | head -30 || true

      - name: Create Android local.properties
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$SDK" > android/local.properties
          echo "flutter.sdk=${FLUTTER_ROOT}" >> android/local.properties
          cat android/local.properties

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze project
        run: |
          set +e
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee analyze.log
          code=${PIPESTATUS[0]}
          echo "Analyzer exit code: $code"
          if [ $code -ne 0 ]; then
            echo "::warning::flutter analyze reported issues (see analyze.log). Continuing to build."
            tail -100 analyze.log || true
          fi
          exit 0

      - name: Run Flutter tests
        run: flutter test --reporter expanded || true

      - name: Verify architecture wiring
        run: |
          test -f lib/services/playback_coordinator.dart
          test -f lib/services/audio_effects_controller.dart
          grep -q "final PlaybackCoordinator _playbackCoordinator" lib/providers/music_provider.dart
          grep -q "AudioEffectsController" lib/providers/music_provider.dart
          grep -q "playbackQueue" lib/services/audio_service_handler.dart

      - name: Build release APK
        run: |
          set -o pipefail
          rm -f build.log
          for attempt in 1 2 3; do
            echo "Gradle/Flutter build attempt $attempt/3"
            if flutter clean && flutter build apk --release --no-shrink --verbose 2>&1 | tee build.log; then
              exit 0
            fi
            if grep -Eq '429|Too Many Requests|Could not GET|Could not HEAD|Could not resolve' build.log && [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Transient dependency-resolution failure; waiting ${delay}s."
              sleep "$delay"
            else
              exit 1
            fi
          done

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Show build log on failure
        if: failure()
        run: tail -400 build.log || true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: resonate-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
