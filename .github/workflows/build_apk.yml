name: Build Resonate APK

on:
  workflow_dispatch:
  push:
    branches:
      - Intelligence

permissions:
  contents: read

jobs:
  build:
    name: Build Resonate APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java
      # ---------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 3. Flutter
      # ---------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      # ---------------------------------------------------------
      # 4. Flutter information
      # ---------------------------------------------------------
      - name: Flutter version
        run: flutter --version

      - name: Flutter doctor
        run: flutter doctor -v

      # ---------------------------------------------------------
      # 5. Android SDK / NDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;28.2.13676358"
          sdkmanager "cmake;3.22.1"

      # ---------------------------------------------------------
      # 6. Flutter dependencies
      # ---------------------------------------------------------
      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      # ---------------------------------------------------------
      # 7. Create Android local.properties
      # ---------------------------------------------------------
      - name: Create local.properties
        run: |
          echo "Creating android/local.properties..."

          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

          echo "Contents of android/local.properties:"
          cat android/local.properties

      # ---------------------------------------------------------
      # 8. Configure Gradle permissions
      # ---------------------------------------------------------
      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew
          ls -l android/gradlew

      # ---------------------------------------------------------
      # 9. Flutter analyze
      # ---------------------------------------------------------
      - name: Flutter analyze
        run: flutter analyze
        continue-on-error: true

      # ---------------------------------------------------------
      # 10. Build release APK
      # ---------------------------------------------------------
      - name: Build release APK
        run: |
          flutter build apk --release --no-shrink --verbose 2>&1 | tee build.log

      # ---------------------------------------------------------
      # 11. Locate APK
      # ---------------------------------------------------------
      - name: Locate APK
        if: always()
        run: |
          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find . -type f -name "*.apk" -print || true

          echo ""
          echo "========================================"
          echo "FLUTTER APK OUTPUT"
          echo "========================================"

          ls -lah build/app/outputs/flutter-apk/ 2>/dev/null || true

      # ---------------------------------------------------------
      # 12. Prepare APK
      # ---------------------------------------------------------
      - name: Prepare artifact
        if: success()
        run: |
          APK=$(find build/app/outputs/flutter-apk -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK found."
            exit 1
          fi

          echo "APK found: $APK"

          mkdir -p release
          cp "$APK" release/Resonate-Intelligence-release.apk

      # ---------------------------------------------------------
      # 13. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Resonate-Intelligence-release
          path: release/Resonate-Intelligence-release.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # 14. Build log if something fails
      # ---------------------------------------------------------
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Resonate-build-log
          path: build.log
          if-no-files-found: ignore
