name: Build Resonate APK

on:
  workflow_dispatch:
  push:
    branches:
      - Intelligence

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter clean
        run: flutter clean

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze project
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Increase file watcher limit
        run: |
          echo "Increasing file watcher limit..."
          echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: Set up Gradle 8.9 wrapper
        working-directory: android
        run: |
          set -e
          echo "Downloading Gradle 8.9..."
          mkdir -p gradle/wrapper
          
          # Download Gradle wrapper JAR and properties
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp/
          
          # Copy wrapper JAR
          cp /tmp/gradle-8.9/lib/gradle-8.9.jar gradle/wrapper/gradle-wrapper.jar
          
          # Create gradle-wrapper.properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          networkTimeout=10000
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          # Make gradlew executable
          chmod +x gradlew
          
          echo "Gradle 8.9 wrapper installed"

      - name: Clean Android build
        working-directory: android
        run: ./gradlew clean

      - name: Build release APK
        run: |
          flutter build apk \
            --release

      - name: Locate generated APK
        if: always()
        run: |
          echo "========================================"
          echo "SEARCHING FOR APK FILES"
          echo "========================================"
          echo ""
          echo "Files under build/:"
          find build -type f 2>/dev/null | sort || true
          echo ""
          echo "APK files found:"
          find . -type f -name "*.apk" -print || true

      - name: Prepare APK artifact
        if: success()
        run: |
          set -e

          echo "========================================"
          echo "PREPARING APK ARTIFACT"
          echo "========================================"

          APK=$(find build -type f -name "*release*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was found."
            echo ""
            echo "Complete build directory:"
            find build -type f 2>/dev/null | sort || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release

          cp "$APK" release/Resonate-Intelligence-release.apk

          echo ""
          echo "Prepared:"
          ls -lh release/Resonate-Intelligence-release.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Resonate-Intelligence-release
          path: release/Resonate-Intelligence-release.apk
          if-no-files-found: error
