name: Build Resonate APK

# Temporary one-time patch runner for the 0.1.1 stability update.
on:
  workflow_dispatch:
  push:
    branches:
      - Companion_Features_Diagnostics

permissions:
  contents: write

concurrency:
  group: resonate-apk-manual
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply 0.1.1 source fixes
        run: |
          python3 scripts/apply_011_fixes.py
          rm -f scripts/apply_011_fixes.py
          cat > .github/workflows/build_apk.yml <<'EOF'
          name: Build Resonate APK

          # Release APK builds are intentionally manual during normal development.
          # This commit temporarily permits the current validated branch to produce the
          # APK needed for the multi-device test.

          on:
            workflow_dispatch:
            push:
              branches:
                - Companion_Features_Diagnostics

          permissions:
            contents: read

          concurrency:
            group: resonate-apk-manual
            cancel-in-progress: true

          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 45
              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4

                - name: Set up Java
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'

                - name: Set up Flutter
                  uses: subosito/flutter-action@v2
                  with:
                    flutter-version: '3.47.2'
                    channel: stable
                    cache: true

                - name: Set up Gradle
                  uses: gradle/actions/setup-gradle@v6
                  with:
                    gradle-version: '8.14'
                    cache-read-only: false

                - name: Set up Android SDK
                  uses: android-actions/setup-android@v3

                - name: Install required Android components
                  run: |
                    sdkmanager "platform-tools"
                    sdkmanager "platforms;android-36"
                    sdkmanager "build-tools;36.0.0"
                    sdkmanager "ndk;28.2.13676358"

                - name: Create Android local.properties
                  run: |
                    cat > android/local.properties <<EOF2
                    sdk.dir=${ANDROID_SDK_ROOT}
                    flutter.sdk=${FLUTTER_ROOT}
                    EOF2

                - name: Verify Gradle
                  working-directory: android
                  run: gradle --version

                - name: Get Flutter dependencies
                  run: flutter pub get

                - name: Analyze project
                  run: flutter analyze --no-fatal-warnings --no-fatal-infos

                - name: Run Flutter tests
                  run: flutter test --reporter expanded

                - name: Build release APK
                  run: |
                    set -o pipefail
                    rm -f build.log
                    for attempt in 1 2 3; do
                      echo "Gradle/Flutter build attempt $attempt/3"
                      if flutter clean && flutter build apk --release --no-shrink --verbose 2>&1 | tee build.log; then
                        exit 0
                      fi
                      if grep -Eq '429|Too Many Requests|Could not GET|Could not HEAD|Could not resolve' build.log && [ "$attempt" -lt 3 ]; then
                        delay=$((attempt * 20))
                        echo "Transient dependency-resolution failure detected; waiting ${delay}s before retry."
                        sleep "$delay"
                      else
                        exit 1
                      fi
                    done

                - name: Verify APK exists
                  run: |
                    test -f build/app/outputs/flutter-apk/app-release.apk
                    ls -lh build/app/outputs/flutter-apk/app-release.apk

                - name: Verify APK signature
                  run: |
                    "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

                - name: Show build log on failure
                  if: failure()
                  run: tail -300 build.log || true

                - name: Upload release APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: resonate-release-apk
                    path: build/app/outputs/flutter-apk/app-release.apk
                    retention-days: 3
                    if-no-files-found: error
          EOF
          git config user.name 'Resonate Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib android pubspec.yaml .github/workflows/build_apk.yml
          git commit -m 'fix: stabilize playback and add configurable library scanning'
          git push origin Companion_Features_Diagnostics

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "ndk;28.2.13676358"

      - name: Create Android local.properties
        run: |
          cat > android/local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          flutter.sdk=${FLUTTER_ROOT}
          EOF

      - name: Verify Gradle
        working-directory: android
        run: gradle --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Build release APK
        run: |
          set -o pipefail
          rm -f build.log
          for attempt in 1 2 3; do
            echo "Gradle/Flutter build attempt $attempt/3"
            if flutter clean && flutter build apk --release --no-shrink --verbose 2>&1 | tee build.log; then
              exit 0
            fi
            if grep -Eq '429|Too Many Requests|Could not GET|Could not HEAD|Could not resolve' build.log && [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Transient dependency-resolution failure detected; waiting ${delay}s before retry."
              sleep "$delay"
            else
              exit 1
            fi
          done

      - name: Verify APK exists
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Verify APK signature
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Show build log on failure
        if: failure()
        run: tail -300 build.log || true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: resonate-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
          if-no-files-found: error