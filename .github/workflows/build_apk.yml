      - name: Build Resonate APK - Diagnostic
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "BUILDING RESONATE RELEASE APK"
          echo "========================================"

          flutter clean
          flutter pub get

          echo ""
          echo "========================================"
          echo "STARTING FLUTTER APK BUILD"
          echo "========================================"

          flutter build apk \
            --release \
            --no-shrink \
            --android-skip-build-dependency-validation \
            -v

          BUILD_EXIT=$?

          echo ""
          echo "========================================"
          echo "FLUTTER BUILD EXIT CODE: $BUILD_EXIT"
          echo "========================================"

          echo ""
          echo "========================================"
          echo "SEARCHING FOR ALL APK FILES"
          echo "========================================"

          find . -type f -name "*.apk" -print

          echo ""
          echo "========================================"
          echo "CHECKING EXPECTED FLUTTER APK DIRECTORY"
          echo "========================================"

          if [ -d "build/app/outputs/flutter-apk" ]; then
            ls -lah build/app/outputs/flutter-apk/
          else
            echo "Expected APK directory does not exist."
          fi

          echo ""
          echo "========================================"
          echo "CHECKING GRADLE OUTPUT DIRECTORIES"
          echo "========================================"

          find build -maxdepth 6 -type d -print 2>/dev/null | head -200

          echo ""
          echo "========================================"
          echo "CHECKING GRADLE WRAPPER"
          echo "========================================"

          ls -lah android/gradle/wrapper/ || true

          echo ""
          echo "========================================"
          echo "BUILD DIAGNOSTIC COMPLETE"
          echo "========================================"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "Flutter reported a build failure."
            echo "The diagnostic output above should reveal the real Gradle error."
            exit "$BUILD_EXIT"
          fi
