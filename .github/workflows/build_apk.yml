name: Build Resonate Intelligence APK

on:
  push:
    branches:
      - Intelligence
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout Intelligence branch
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Java 17
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Set up Flutter
      # --------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      # --------------------------------------------------
      # 4. Show environment information
      # --------------------------------------------------
      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor -v

      # --------------------------------------------------
      # 5. Get Flutter dependencies
      # --------------------------------------------------
      - name: Flutter pub get
        run: |
          flutter pub get

      # --------------------------------------------------
      # 6. Clean previous Flutter build files
      # --------------------------------------------------
      - name: Flutter clean
        run: |
          flutter clean
          flutter pub get

      # --------------------------------------------------
      # 7. Check Dart code
      # --------------------------------------------------
      - name: Run flutter analyze
        run: flutter analyze || true
      # --------------------------------------------------
      # 8. Check Android project
      # --------------------------------------------------
      - name: Check Android project
        working-directory: android
        run: |
          echo "========================================"
          echo "ANDROID PROJECT CHECK"
          echo "========================================"

          echo ""
          echo "Gradle wrapper:"
          ls -lh gradle/wrapper/ || true

          echo ""
          echo "Gradle wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties || true

          echo ""
          echo "Settings.gradle:"
          sed -n '1,160p' settings.gradle || true

      # --------------------------------------------------
      # 9. Build release APK
      # --------------------------------------------------
      - name: Build release APK
        run: |
          flutter build apk --release --no-shrink

      # --------------------------------------------------
      # 10. Find generated APK
      # --------------------------------------------------
      - name: Find APK
        id: find_apk
        run: |
          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find build/app/outputs/apk/release -type f -name "*.apk" -print

          APK=$(find build/app/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK found."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "APK FOUND:"
          echo "$APK"

      # --------------------------------------------------
      # 11. Rename APK
      # --------------------------------------------------
      - name: Prepare APK
        run: |
          mkdir -p release

          cp "$APK_PATH" \
            "release/Resonate-Intelligence-release.apk"

          echo "========================================"
          echo "RELEASE APK"
          echo "========================================"

          ls -lh release/

      # --------------------------------------------------
      # 12. Upload APK as GitHub Actions artifact
      # --------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resonate-Intelligence-release
          path: release/Resonate-Intelligence-release.apk
          if-no-files-found: error

      # --------------------------------------------------
      # 13. Final build report
      # --------------------------------------------------
      - name: Final build report
        if: always()
        run: |
          echo ""
          echo "========================================"
          echo "FINAL BUILD REPORT"
          echo "========================================"

          if [ -f "release/Resonate-Intelligence-release.apk" ]; then
            echo ""
            echo "SUCCESS: APK WAS GENERATED."
            echo ""
            echo "Artifact:"
            echo "Resonate-Intelligence-release"
            echo ""
            ls -lh release/Resonate-Intelligence-release.apk
          else
            echo ""
            echo "FAILURE: NO APK WAS FOUND."
            echo ""
            echo "The Flutter/Gradle build failed before producing an APK."
            echo ""
          fi
