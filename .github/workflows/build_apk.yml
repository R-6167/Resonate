name: Build Resonate APK

on:
  workflow_dispatch:
  push:
    branches:
      - Intelligence

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECK OUT THE INTELLIGENCE BRANCH
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. SET UP JAVA
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. SET UP FLUTTER
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      # ============================================================
      # 4. SHOW ENVIRONMENT
      # ============================================================
      - name: Check Flutter and Dart
        run: |
          flutter --version
          dart --version
          java -version

      # ============================================================
      # 5. CREATE ANDROID LOCAL.PROPERTIES
      #
      # This file must exist because your android/settings.gradle
      # reads it. It should NOT be committed to GitHub.
      # ============================================================
      - name: Create Android local.properties
        working-directory: android
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

          echo "========================================"
          echo "ANDROID LOCAL.PROPERTIES"
          echo "========================================"
          cat local.properties

      # ============================================================
      # 6. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Check Android project
        working-directory: android
        run: |
          echo "========================================"
          echo "ANDROID PROJECT CHECK"
          echo "========================================"

          echo "Gradle wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties || true

          echo ""
          echo "Android directory:"
          ls -lah

          echo ""
          echo "Gradle wrapper directory:"
          ls -lah gradle/wrapper/ || true

      # ============================================================
      # 7. GET FLUTTER DEPENDENCIES
      # ============================================================
      - name: Flutter pub get
        run: |
          flutter pub get

      # ============================================================
      # 8. ANALYZE PROJECT
      #
      # We don't stop the build for analyzer warnings/deprecations.
      # The actual APK compilation is what determines whether the
      # application can be built.
      # ============================================================
      - name: Flutter analyze
        run: |
          flutter analyze || true

      # ============================================================
      # 9. BUILD RELEASE APK
      #
      # Flutter will use the Android project and its Gradle setup.
      # --no-shrink avoids R8/shrinker complications while we get
      # the Intelligence branch producing a working APK.
      # ============================================================
      - name: Build release APK
        run: |
          flutter build apk --release --no-shrink

      # ============================================================
      # 10. FIND GENERATED APK
      # ============================================================
      - name: Find APK
        run: |
          echo "========================================"
          echo "SEARCHING FOR GENERATED APK"
          echo "========================================"

          find build/app/outputs/apk -type f -name "*.apk" -print

      # ============================================================
      # 11. RENAME APK
      # ============================================================
      - name: Prepare APK artifact
        run: |
          mkdir -p release-apk

          APK=$(find build/app/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          cp "$APK" release-apk/Resonate-Intelligence-release.apk

          echo ""
          echo "Prepared:"
          ls -lh release-apk/

      # ============================================================
      # 12. UPLOAD APK TO GITHUB ACTIONS
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Resonate-Intelligence-release
          path: release-apk/Resonate-Intelligence-release.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 13. FINAL REPORT
      # ============================================================
      - name: Final build report
        run: |
          echo ""
          echo "========================================"
          echo "        RESONATE BUILD SUCCESS"
          echo "========================================"
          echo ""
          echo "APK successfully generated."
          echo ""
          echo "Artifact:"
          echo "Resonate-Intelligence-release"
          echo ""
          echo "File:"
          ls -lh release-apk/Resonate-Intelligence-release.apk
          echo ""
          echo "========================================"
