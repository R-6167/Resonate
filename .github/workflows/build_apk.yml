name: Build Resonate APK

on:
  workflow_dispatch:
  push:
    branches:
      - Intelligence

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter clean
        run: flutter clean

      - name: Get Flutter packages
        run: flutter pub get

      - name: Increase file watcher limit
        run: |
          echo "Increasing inotify limits..."
          echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: Clean build directories
        run: |
          rm -rf ~/.gradle
          rm -rf android/.gradle
          rm -rf android/build
          rm -rf build

      - name: Reset Gradle wrapper
        working-directory: android
        run: |
          set -e
          echo "Cleaning old wrapper files..."
          rm -rf gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          mkdir -p gradle/wrapper
          
          echo "Downloading Gradle 8.14..."
          curl -L -o /tmp/gradle-8.14-all.zip https://services.gradle.org/distributions/gradle-8.14-all.zip
          
          echo "Extracting Gradle..."
          cd /tmp
          unzip -q gradle-8.14-all.zip
          
          echo "Finding JAR file..."
          JAR_FILE=$(find /tmp/gradle-8.14 -name "gradle-*.jar" -type f | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: Could not find gradle JAR in extracted files"
            exit 1
          fi
          
          echo "Copying JAR: $JAR_FILE"
          cp "$JAR_FILE" "$(pwd)/gradle/wrapper/gradle-wrapper.jar"
          
          echo "Creating wrapper properties..."
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-bin.zip
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          echo "Making gradlew executable..."
          chmod +x gradlew
          
          echo "Gradle 8.14 wrapper ready"

      - name: Build release APK
        run: flutter build apk --release --verbose 2>&1 | tee build.log || true

      - name: Show build output
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "=== BUILD LOG (Last 150 lines) ==="
            tail -150 build.log
          else
            echo "No build.log found"
          fi

      - name: Locate APK
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find . -type f -name "*.apk" -ls 2>/dev/null || echo "No APK found"
          echo ""
          echo "=== Build directory structure ==="
          ls -lah build/app/outputs/flutter-apk/ 2>/dev/null || echo "flutter-apk directory not found"

      - name: Prepare artifact
        if: success()
        run: |
          APK=$(find . -name "*release*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"; 
            exit 1
          fi
          mkdir -p release
          cp "$APK" release/Resonate-Intelligence-release.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Resonate-Intelligence-release
          path: release/Resonate-Intelligence-release.apk
          if-no-files-found: error
