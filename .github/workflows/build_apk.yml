name: Build Resonate APK

on:
  workflow_dispatch:
  push:
    branches:
      - Companion_Features_Diagnostics

permissions:
  contents: write

concurrency:
  group: resonate-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Phase 2 implementation
        run: |
          set -e
          grep -q "IntelligenceEvidenceCache" lib/providers/intelligence_provider.dart || echo "WARN: IntelligenceEvidenceCache not found"
          grep -q "LibraryVisibilityStore" lib/providers/intelligence_provider.dart || echo "WARN: LibraryVisibilityStore not found"
          grep -q "PlaybackEventKind\|PlaybackAuthority" lib/services/playback_authority.dart || echo "WARN: PlaybackAuthority symbols missing"
          grep -q "playbackQueue\|AudioServiceHandler" lib/services/audio_service_handler.dart || echo "WARN: audio_service_handler symbols missing"
          echo "Phase 2 verification completed"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'
          cache-read-only: false
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: tools platform-tools
      - name: Install Android components
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" || true
          sdkmanager --install "platforms;android-36" || sdkmanager --install "platforms;android-35" || sdkmanager --install "platforms;android-34"
          sdkmanager --install "build-tools;36.0.0" || sdkmanager --install "build-tools;35.0.0" || sdkmanager --install "build-tools;34.0.0"
          sdkmanager --install "ndk;28.2.13676358" || echo "NDK install skipped (optional)"
          echo "Android SDK packages installed:"
          sdkmanager --list_installed | head -40
      - name: Create Android local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties
          echo "flutter.sdk=${FLUTTER_ROOT}" >> android/local.properties
          cat android/local.properties
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Analyze project
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test --reporter expanded
      - name: Verify architecture wiring
        run: |
          test -f lib/services/playback_coordinator.dart
          test -f lib/services/audio_effects_controller.dart
          grep -q "final PlaybackCoordinator _playbackCoordinator" lib/providers/music_provider.dart
          grep -q "AudioEffectsController" lib/providers/music_provider.dart
          grep -q "_playbackCoordinator.runSourceMutation" lib/providers/music_provider.dart
          grep -q "_playbackCoordinator.runTransport" lib/providers/music_provider.dart
          ! grep -q "final AudioPlayer _fallbackPlayer" lib/services/audio_service_handler.dart
          grep -q "playbackQueue" lib/services/audio_service_handler.dart
      - name: Build release APK
        run: |
          set -o pipefail
          rm -f build.log
          for attempt in 1 2 3; do
            echo "Gradle/Flutter build attempt $attempt/3"
            if flutter clean && flutter build apk --release --no-shrink --verbose 2>&1 | tee build.log; then
              exit 0
            fi
            if grep -Eq '429|Too Many Requests|Could not GET|Could not HEAD|Could not resolve' build.log && [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Transient dependency-resolution failure; waiting ${delay}s."
              sleep "$delay"
            else
              exit 1
            fi
          done
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk || \
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk || \
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
      - name: Show build log on failure
        if: failure()
        run: tail -300 build.log || true
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: resonate-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
