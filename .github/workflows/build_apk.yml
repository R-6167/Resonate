name: Build Resonate APK

on:
  workflow_dispatch:
  push:
    branches:
      - Intelligence

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter clean
        run: flutter clean

      - name: Get Flutter packages
        run: flutter pub get

      - name: Increase file watcher limit
        run: |
          echo "Increasing inotify limits..."
          echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: Clear Gradle cache
        run: |
          rm -rf ~/.gradle
          rm -rf android/.gradle
          rm -rf android/build

      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --verbose 2>&1 | head -200

      - name: Locate generated APK
        if: always()
        run: |
          echo "========================================"
          echo "SEARCHING FOR APK FILES"
          echo "========================================"
          echo ""
          find . -type f -name "*.apk" -ls 2>/dev/null || echo "No APK files found"

      - name: Prepare APK artifact
        if: success()
        run: |
          set -e

          echo "========================================"
          echo "PREPARING APK ARTIFACT"
          echo "========================================"

          APK=$(find . -type f -name "*release*.apk" -print | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No release APK was found."
            exit 1
          fi

          echo "APK found: $APK"

          mkdir -p release
          cp "$APK" release/Resonate-Intelligence-release.apk
          ls -lh release/Resonate-Intelligence-release.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Resonate-Intelligence-release
          path: release/Resonate-Intelligence-release.apk
          if-no-files-found: error
