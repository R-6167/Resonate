name: Build Resonate APK

on:
  workflow_dispatch:
  push:
    branches:
      - Intelligence

permissions:
  contents: read

jobs:
  build:
    name: Build Resonate APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Set up Java
      # ---------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 3. Set up Flutter
      # ---------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      # ---------------------------------------------------------
      # 4. Flutter information
      # ---------------------------------------------------------
      - name: Flutter version
        run: flutter --version

      - name: Flutter doctor
        run: flutter doctor -v

      # ---------------------------------------------------------
      # 5. Android SDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------
      # 6. Install required Android NDK
      # ---------------------------------------------------------
      - name: Install Android NDK 28.2
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;28.2.13676358"
          sdkmanager "cmake;3.22.1"

      # ---------------------------------------------------------
      # 7. Set up Gradle
      # ---------------------------------------------------------
      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      # ---------------------------------------------------------
      # 8. Generate a REAL Gradle wrapper
      # ---------------------------------------------------------
      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          set -e

          echo "Generating Gradle wrapper..."

          gradle wrapper \
            --gradle-version 8.14 \
            --distribution-type all

          chmod +x gradlew

          echo ""
          echo "Gradle wrapper generated successfully."

          echo ""
          echo "Wrapper files:"
          ls -lah gradle/wrapper/
          ls -lah gradlew

      # ---------------------------------------------------------
      # 9. Clean Flutter project
      # ---------------------------------------------------------
      - name: Flutter clean
        run: flutter clean

      # ---------------------------------------------------------
      # 10. Get Flutter packages
      # ---------------------------------------------------------
      - name: Get Flutter packages
        run: flutter pub get

      # ---------------------------------------------------------
      # 11. Build release APK
      # ---------------------------------------------------------
      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release --no-shrink --verbose 2>&1 | tee build.log

      # ---------------------------------------------------------
      # 12. Show build output if anything went wrong
      # ---------------------------------------------------------
      - name: Show build output
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "========================================"
            echo "LAST 200 LINES OF BUILD LOG"
            echo "========================================"
            tail -200 build.log
          else
            echo "No build.log found."
          fi

      # ---------------------------------------------------------
      # 13. Locate APK
      # ---------------------------------------------------------
      - name: Locate APK
        if: always()
        run: |
          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find . -type f -name "*.apk" -print 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "EXPECTED FLUTTER APK DIRECTORY"
          echo "========================================"

          ls -lah build/app/outputs/flutter-apk/ 2>/dev/null || true

      # ---------------------------------------------------------
      # 14. Prepare APK artifact
      # ---------------------------------------------------------
      - name: Prepare artifact
        if: success()
        run: |
          set -e

          APK=$(find . -type f -name "*release*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: No release APK was found."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release

          cp "$APK" release/Resonate-Intelligence-release.apk

          echo ""
          echo "Artifact prepared:"
          ls -lh release/

      # ---------------------------------------------------------
      # 15. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Resonate-Intelligence-release
          path: release/Resonate-Intelligence-release.apk
          if-no-files-found: error
