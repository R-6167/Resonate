name: Build Resonate APK

on:
  push:
    branches:
      - Intelligence
  workflow_dispatch:

jobs:
  build:
    name: Build Resonate Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECK OUT THE REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SET UP JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ============================================================
      # 3. SET UP FLUTTER
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true


      # ============================================================
      # 4. SHOW FLUTTER / JAVA INFORMATION
      # ============================================================
      - name: Show environment
        run: |
          echo "========================================"
          echo "ENVIRONMENT"
          echo "========================================"

          flutter --version
          java -version

          echo ""
          echo "Flutter location:"
          which flutter

          echo ""
          echo "Java location:"
          which java


      # ============================================================
      # 5. CREATE ANDROID LOCAL.PROPERTIES
      #
      # settings.gradle requires this file.
      # GitHub runners do not have your local.properties file.
      # ============================================================
      - name: Create Android local.properties
        working-directory: android
        run: |
          set -e

          echo "========================================"
          echo "CREATING ANDROID LOCAL.PROPERTIES"
          echo "========================================"

          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

          echo ""
          echo "Created:"
          cat local.properties


      # ============================================================
      # 6. DOWNLOAD GRADLE 8.14
      # ============================================================
      - name: Download Gradle 8.14
        run: |
          set -e

          echo "========================================"
          echo "DOWNLOADING GRADLE 8.14"
          echo "========================================"

          wget -q \
            https://services.gradle.org/distributions/gradle-8.14-bin.zip \
            -O /tmp/gradle-8.14-bin.zip

          echo "Gradle downloaded successfully."

          ls -lh /tmp/gradle-8.14-bin.zip


      # ============================================================
      # 7. EXTRACT GRADLE
      # ============================================================
      - name: Extract Gradle 8.14
        run: |
          set -e

          echo "========================================"
          echo "EXTRACTING GRADLE"
          echo "========================================"

          rm -rf /tmp/gradle-8.14
          mkdir -p /tmp/gradle-8.14

          unzip -q \
            /tmp/gradle-8.14-bin.zip \
            -d /tmp/gradle-8.14

          echo "Gradle extracted."

          /tmp/gradle-8.14/gradle-8.14/bin/gradle --version


      # ============================================================
      # 8. REGENERATE THE GRADLE WRAPPER
      #
      # IMPORTANT:
      # local.properties already exists, so settings.gradle
      # can now be evaluated successfully.
      # ============================================================
      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          set -e

          echo "========================================"
          echo "GENERATING GRADLE WRAPPER"
          echo "========================================"

          echo ""
          echo "Current wrapper directory:"
          ls -lah gradle/wrapper/ || true

          echo ""
          echo "Removing broken wrapper files..."
          rm -f gradle/wrapper/gradle-wrapper.jar
          rm -f gradlew
          rm -f gradlew.bat

          echo ""
          echo "Generating official Gradle 8.14 wrapper..."

          /tmp/gradle-8.14/gradle-8.14/bin/gradle wrapper \
            --gradle-version 8.14 \
            --distribution-type bin

          echo ""
          echo "Wrapper generated."

          echo ""
          echo "Wrapper files:"
          ls -lah gradle/wrapper/

          echo ""
          echo "Wrapper script:"
          ls -lah gradlew

          echo ""
          echo "Wrapper JAR:"
          ls -lah gradle/wrapper/gradle-wrapper.jar

          echo ""
          echo "Checking wrapper JAR:"
          file gradle/wrapper/gradle-wrapper.jar

          echo ""
          echo "Checking wrapper script:"
          head -20 gradlew


      # ============================================================
      # 9. MAKE SURE GRADLE WRAPPER IS EXECUTABLE
      # ============================================================
      - name: Make Gradle wrapper executable
        working-directory: android
        run: |
          set -e

          chmod +x gradlew

          echo "Gradle wrapper permissions:"
          ls -lah gradlew


      # ============================================================
      # 10. TEST GRADLE WRAPPER
      # ============================================================
      - name: Test Gradle wrapper
        working-directory: android
        run: |
          set -e

          echo "========================================"
          echo "TESTING GRADLE WRAPPER"
          echo "========================================"

          ./gradlew --version


      # ============================================================
      # 11. GET FLUTTER DEPENDENCIES
      # ============================================================
      - name: Flutter pub get
        run: |
          set -e

          echo "========================================"
          echo "FLUTTER PUB GET"
          echo "========================================"

          flutter pub get


      # ============================================================
      # 12. RUN FLUTTER ANALYZE
      #
      # Your current project has analyzer INFO/WARNING messages.
      # They should not prevent the APK from being built.
      # ============================================================
      - name: Flutter analyze
        run: |
          echo "========================================"
          echo "FLUTTER ANALYZE"
          echo "========================================"

          flutter analyze || true

          echo ""
          echo "Flutter analyze completed."
          echo "Analyzer warnings/info messages do not stop the APK build."


      # ============================================================
      # 13. BUILD RELEASE APK
      # ============================================================
      - name: Build release APK
        run: |
          set -e

          echo "========================================"
          echo "BUILDING RESONATE RELEASE APK"
          echo "========================================"

          flutter build apk --release --no-shrink


      # ============================================================
      # 14. FIND GENERATED APK
      # ============================================================
      - name: Find APK
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          echo ""
          echo "Build directory:"
          find build/app/outputs/flutter-apk \
            -maxdepth 2 \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find build/app/outputs/flutter-apk \
            -maxdepth 2 \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "APK successfully generated."


      # ============================================================
      # 15. RENAME APK
      # ============================================================
      - name: Prepare APK artifact
        run: |
          set -e

          mkdir -p release

          APK=$(find build/app/outputs/flutter-apk \
            -maxdepth 2 \
            -type f \
            -name "*.apk" \
            | head -1)

          cp "$APK" \
            "release/Resonate-Intelligence-release.apk"

          echo "APK prepared:"
          ls -lh release/


      # ============================================================
      # 16. UPLOAD APK TO GITHUB ACTIONS
      # ============================================================
      - name: Upload Resonate APK
        uses: actions/upload-artifact@v4
        with:
          name: Resonate-Intelligence-release
          path: release/Resonate-Intelligence-release.apk
          if-no-files-found: error


      # ============================================================
      # 17. FINAL REPORT
      # ============================================================
      - name: Final build report
        run: |
          echo ""
          echo "========================================"
          echo "FINAL BUILD REPORT"
          echo "========================================"

          echo ""
          echo "SUCCESS: RESONATE APK WAS GENERATED."
          echo ""

          echo "Artifact:"
          echo "Resonate-Intelligence-release"
          echo ""

          echo "APK:"
          ls -lh release/Resonate-Intelligence-release.apk
          echo ""

          echo "========================================"
          echo "BUILD COMPLETE"
          echo "========================================"
