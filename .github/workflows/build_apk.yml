name: Build Resonate APK

on:
  workflow_dispatch:
  push:
    branches:
      - Companion_Features_Diagnostics

permissions:
  contents: write

concurrency:
  group: resonate-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply complete Phase 2 hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/providers/intelligence_provider.dart')
          s = p.read_text()
          if "../services/intelligence_evidence_cache.dart" not in s:
              s = s.replace("import '../services/database_helper.dart';", "import '../services/database_helper.dart';\nimport '../services/intelligence_evidence_cache.dart';", 1)
          s = s.replace("final events = await _database.getRecentListeningEvents(limit: 200);", "final events = await IntelligenceEvidenceCache.instance.recentEvents(limit: 200);", 1)
          if "LibraryVisibilityStore.instance.addListener(_onVisibilityChanged);" not in s:
              s = s.replace("IntelligenceProvider({required this.music}) {", "IntelligenceProvider({required this.music}) {\n    LibraryVisibilityStore.instance.addListener(_onVisibilityChanged);", 1)
              s = s.replace("  void _observePlayback() {", "  void _onVisibilityChanged() {\n    IntelligenceEvidenceCache.instance.invalidate();\n    if (_enabled) unawaited(refreshRecommendations());\n  }\n\n  void _observePlayback() {", 1)
              s = s.replace("  void dispose() {", "  void dispose() {\n    LibraryVisibilityStore.instance.removeListener(_onVisibilityChanged);", 1)
          p.write_text(s)
          PY

      - name: Verify Phase 2 implementation
        run: |
          set -e
          grep -q "IntelligenceEvidenceCache.instance.recentEvents" lib/providers/intelligence_provider.dart
          grep -q "LibraryVisibilityStore.instance.addListener(_onVisibilityChanged)" lib/providers/intelligence_provider.dart
          grep -q "bool get isHealthy" lib/services/database_helper.dart
          grep -q "_markDatabaseFailure" lib/services/database_helper.dart
          grep -q "_pendingEvents" lib/services/resonate_diagnostics.dart
          grep -q "_flushPendingEvents" lib/services/resonate_diagnostics.dart
          grep -q "PlaybackEventKind" lib/services/playback_authority.dart
          grep -q "_onAuthorityEvent" lib/providers/autopilot_controller.dart
          ! grep -q "final AudioPlayer _fallbackPlayer" lib/services/audio_service_handler.dart
          grep -q "playbackQueue" lib/services/audio_service_handler.dart
          git diff --check

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'
          cache-read-only: false
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "ndk;28.2.13676358"
      - name: Create Android local.properties
        run: |
          cat > android/local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          flutter.sdk=${FLUTTER_ROOT}
          EOF
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Analyze project
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test --reporter expanded
      - name: Verify architecture wiring
        run: |
          test -f lib/services/playback_coordinator.dart
          test -f lib/services/audio_effects_controller.dart
          grep -q "final PlaybackCoordinator _playbackCoordinator" lib/providers/music_provider.dart
          grep -q "AudioEffectsController" lib/providers/music_provider.dart
          grep -q "_playbackCoordinator.runSourceMutation" lib/providers/music_provider.dart
          grep -q "_playbackCoordinator.runTransport" lib/providers/music_provider.dart
          ! grep -q "final AudioPlayer _fallbackPlayer" lib/services/audio_service_handler.dart
          grep -q "playbackQueue" lib/services/audio_service_handler.dart
      - name: Build release APK
        run: |
          set -o pipefail
          rm -f build.log
          for attempt in 1 2 3; do
            echo "Gradle/Flutter build attempt $attempt/3"
            if flutter clean && flutter build apk --release --no-shrink --verbose 2>&1 | tee build.log; then
              exit 0
            fi
            if grep -Eq '429|Too Many Requests|Could not GET|Could not HEAD|Could not resolve' build.log && [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Transient dependency-resolution failure; waiting ${delay}s."
              sleep "$delay"
            else
              exit 1
            fi
          done
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
      - name: Show build log on failure
        if: failure()
        run: tail -300 build.log || true
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: resonate-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
      - name: Persist completed Phase 2 source
        run: |
          git config user.name 'Resonate Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib
          if git diff --cached --quiet; then
            echo 'No Phase 2 source changes were needed.'
          else
            git diff --cached --check
            git commit -m 'feat: complete phase 2 architecture hardening'
            git push origin HEAD:Companion_Features_Diagnostics
          fi
