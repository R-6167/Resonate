name: flutter-build-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.14

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: flutter build apk --release --no-shrink
        
      - name: Inspect build outputs
        if: always()
        run: |
          echo "=== APK FILES ==="
          find . -type f -name "*.apk" -print

          echo "=== AAB FILES ==="
          find . -type f -name "*.aab" -print

          echo "=== BUILD DIRECTORY ==="
          find build -maxdepth 6 -type f 2>/dev/null | head -300

          echo "=== ANDROID OUTPUTS ==="
          find android -type f \( -name "*.apk" -o -name "*.aab" \) -print

      
