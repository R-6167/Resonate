name: Harden DSP auto route
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/harden_dsp_route_eq_wire.py"
      - "lib/services/audio_output_route.dart"
      - "lib/services/equalizer_dvc_sync.dart"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_engine_v2
          fetch-depth: 0
      - run: python3 tools/harden_dsp_route_eq_wire.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "harden: wire EQ to route-aware virtual bass policy"
          git push origin dj_engine_v2
