name: Flutter Check

on:
  push:
    branches:
      - Intelligence
      - Playback_Stability_Diagnostics
      - Companion_Features_Diagnostics
  pull_request:
    branches:
      - Intelligence
      - Playback_Stability_Diagnostics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply one-time playback companion finishing pass
        if: hashFiles('tools/finish_playback_companion.py') != ''
        run: |
          python3 tools/finish_playback_companion.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/finish_playback_companion.py .github/workflows/finish_playback_companion.yml
          git add lib/providers/music_provider.dart lib/screens/player_screen.dart lib/providers/autopilot_controller.dart lib/providers/intelligence_provider.dart
          git commit -m "Apply playback companion finishing pass"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Clean project
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --reporter expanded
