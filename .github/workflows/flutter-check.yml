name: Flutter Check

on:
  push:
    branches:
      - Intelligence
      - Playback_Stability_Diagnostics
      - Companion_Features_Diagnostics
  pull_request:
    branches:
      - Intelligence
      - Playback_Stability_Diagnostics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repair one-time finishing script
        if: hashFiles('tools/finish_playback_companion.py') != ''
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/finish_playback_companion.py')
          s = p.read_text()
          old_start = 'needle = """      _recommendations = ranked.take(limit).toList();'
          start = s.find(old_start)
          if start < 0:
              raise SystemExit('Old Intelligence telemetry patch block was not found')
          end_marker = 's = s.replace(needle, repl, 1)'
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit('End of old Intelligence telemetry patch block was not found')
          end += len(end_marker)
          replacement = '''needle = """      ranked.sort((a, b) => b.score.compareTo(a.score)); _recommendations = ranked.take(limit).toList(growable: false); await _evaluateAutopilotGraduation(); if (notify) notifyListeners();"""
repl = """      ranked.sort((a, b) => b.score.compareTo(a.score)); _recommendations = ranked.take(limit).toList(growable: false);
      await ResonateDiagnostics.recordIntelligence(
        'recommendations_generated',
        data: {
          'mode': autonomyLabel,
          'sessionMode': _sessionMode,
          'count': _recommendations.length,
          'topSongId': _recommendations.isEmpty ? null : _recommendations.first.song.id,
          'topConfidence': _recommendations.isEmpty ? 0 : _recommendations.first.confidence,
          'exploration': exploration,
        },
      );
      await _evaluateAutopilotGraduation(); if (notify) notifyListeners();"""
s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY

      - name: Apply one-time playback companion finishing pass
        if: hashFiles('tools/finish_playback_companion.py') != ''
        run: |
          python3 tools/finish_playback_companion.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/finish_playback_companion.py .github/workflows/finish_playback_companion.yml
          git add lib/providers/music_provider.dart lib/screens/player_screen.dart lib/providers/autopilot_controller.dart lib/providers/intelligence_provider.dart
          git commit -m "Apply playback companion finishing pass"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Clean project
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --reporter expanded
