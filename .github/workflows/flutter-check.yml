name: Flutter Check

# Keep validation useful on PRs and when explicitly requested, rather than
# creating a check for every small development commit.

on:
  pull_request:
    branches:
      - Intelligence
      - Playback_Stability_Diagnostics
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Clean project
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --reporter expanded
