name: Apply DJ NOW UI intel
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_dj_now_ui_intel.yml'
      - 'tools/apply_dj_now_ui_intel.py'
      - 'lib/widgets/dj_mode_status_chip.dart'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: |
          set -euo pipefail
          python3 tools/apply_dj_now_ui_intel.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add \
            lib/screens/player_screen.dart \
            lib/screens/home_screen.dart \
            lib/screens/queue_screen.dart \
            lib/screens/crossfade_screen.dart \
            lib/services/intelligence_decision_engine.dart \
            lib/providers/music_provider.dart \
            lib/widgets/dj_mode_status_chip.dart
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feat(dj): NOW — status chips, energy ranking, queue-head warm"
            git push origin HEAD:dj_Mode
          fi
