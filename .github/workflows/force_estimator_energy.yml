name: Force estimator energy
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/force_estimator_energy.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 0
      - name: Patch estimator
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import re
          EST = Path('lib/services/dj_bpm_estimator.dart')
          t = EST.read_text()
          new_class = '''class DjBpmEstimate {
            final double bpm;
            final double confidence;
            final int beatOffsetMs;
            final String source;
            final int? keyRoot;
            final String? keyMode;
            final double keyConfidence;
            /// Relative energy 0–1 from PCM window (null when ID3-only / unknown).
            final double? energy;
            /// Approximate loudness 0–1 from PCM window.
            final double? loudness;

            const DjBpmEstimate({
              required this.bpm,
              required this.confidence,
              this.beatOffsetMs = 0,
              this.source = 'unknown',
              this.keyRoot,
              this.keyMode,
              this.keyConfidence = 0.0,
              this.energy,
              this.loudness,
            });
          }'''
          # normalize indent to 2 spaces like file
          new_class = new_class.replace('            ', '  ').replace('class DjBpmEstimate {', 'class DjBpmEstimate {', 1)
          # fix - rebuild clean
          new_class = "class DjBpmEstimate {\n  final double bpm;\n  final double confidence;\n  final int beatOffsetMs;\n  final String source;\n  final int? keyRoot;\n  final String? keyMode;\n  final double keyConfidence;\n  /// Relative energy 0–1 from PCM window (null when ID3-only / unknown).\n  final double? energy;\n  /// Approximate loudness 0–1 from PCM window.\n  final double? loudness;\n\n  const DjBpmEstimate({\n    required this.bpm,\n    required this.confidence,\n    this.beatOffsetMs = 0,\n    this.source = 'unknown',\n    this.keyRoot,\n    this.keyMode,\n    this.keyConfidence = 0.0,\n    this.energy,\n    this.loudness,\n  });\n}"
          m = re.search(r'class DjBpmEstimate \{.*?\n\}\n', t, re.S)
          if not m:
              raise SystemExit('regex miss')
          t = t[:m.start()] + new_class + '\n' + t[m.end():]
          reps = [
          ('''          return DjBpmEstimate(
            bpm: nativePcm.bpm,
            confidence: nativePcm.confidence,
            beatOffsetMs: nativePcm.beatOffsetMs,
            source: nativePcm.source,
            keyRoot: key.keyRoot,
            keyMode: key.keyMode,
            keyConfidence: key.confidence,
          );''',
           '''          return DjBpmEstimate(
            bpm: nativePcm.bpm,
            confidence: nativePcm.confidence,
            beatOffsetMs: nativePcm.beatOffsetMs,
            source: nativePcm.source,
            keyRoot: key.keyRoot,
            keyMode: key.keyMode,
            keyConfidence: key.confidence,
            energy: nativePcm.energy,
            loudness: nativePcm.loudness,
          );'''),
          ('''          return DjBpmEstimate(
            bpm: pcm.bpm,
            confidence: pcm.confidence,
            beatOffsetMs: pcm.beatOffsetMs,
            source: 'pcm_wav',
            keyRoot: key?.keyRoot,
            keyMode: key?.keyMode,
            keyConfidence: key?.confidence ?? 0.0,
          );''',
           '''          return DjBpmEstimate(
            bpm: pcm.bpm,
            confidence: pcm.confidence,
            beatOffsetMs: pcm.beatOffsetMs,
            source: 'pcm_wav',
            keyRoot: key?.keyRoot,
            keyMode: key?.keyMode,
            keyConfidence: key?.confidence ?? 0.0,
            energy: pcm.energy,
            loudness: pcm.loudness,
          );'''),
          ('''      return DjBpmEstimate(
        bpm: est.bpm,
        confidence: est.confidence,
        beatOffsetMs: est.beatOffsetMs,
        source: 'pcm_native',
      );''',
           '''      return DjBpmEstimate(
        bpm: est.bpm,
        confidence: est.confidence,
        beatOffsetMs: est.beatOffsetMs,
        source: 'pcm_native',
        energy: est.energy,
        loudness: est.loudness,
      );'''),
          ]
          for a,b in reps:
              if a in t:
                  t = t.replace(a,b,1)
                  print('replaced return')
              else:
                  print('skip return (already or miss)')
          EST.write_text(t)
          assert 'final double? energy;' in EST.read_text()
          print('VERIFY ok')
          PY
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/services/dj_bpm_estimator.dart
          if git diff --cached --quiet; then
            echo "no changes - already applied?"
            grep -n energy lib/services/dj_bpm_estimator.dart | head || true
          else
            git commit -m "feat(dj): estimator carries energy/loudness from PCM"
            git push origin HEAD:dj_Mode
          fi
