name: Fix BT route method
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix_bt_route_method.yml'
      - 'tools/fix_bt_route_method.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: |
          set -euo pipefail
          python3 tools/fix_bt_route_method.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/providers/music_provider.dart
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fix(dj): define _onAudioRouteChanged and fix devices subscription type"
            git push origin HEAD:dj_Mode
          fi
