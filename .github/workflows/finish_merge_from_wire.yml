name: Finish Wire DSP merge onto dj_Mode
on:
  workflow_dispatch:
  push:
    branches: [dj_Mode]
    paths:
      - 'tools/finish_merge_from_wire.py'
      - '.github/workflows/finish_merge_from_wire.yml'
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 0
      - name: Copy DSP from Wire_dsp_engine
        run: python3 tools/finish_merge_from_wire.py
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes"
          else
            git commit -m "merge(dsp): finish Wire_dsp_engine DSP onto dj_Mode (library/DJ kept)"
            git pull --rebase origin dj_Mode || true
            git push origin HEAD:dj_Mode
          fi
