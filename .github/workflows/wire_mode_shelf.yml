name: Wire Mode shelf on home
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/wire_mode_shelf.py"
      - "lib/services/mode_shelf_builder.dart"
      - "lib/widgets/mode_shelf_card.dart"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modes_on_dj_v2
          fetch-depth: 0
      - run: python3 tools/wire_mode_shelf.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "feat(modes): Mode shelf card on Home (virtual playlist)"
          git push origin modes_on_dj_v2
