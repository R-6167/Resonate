name: Polish step 6 sheets + cards
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/polish_step6_sheets_cards.py"
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 0
      - run: python3 tools/polish_step6_sheets_cards.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add lib/widgets/blur_sheet.dart \
                  lib/widgets/autopilot_home_card.dart \
                  lib/widgets/evolving_mix_card.dart
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "ui: glass step 6 (sheets, Autopilot, Evolving mix)"
          git pull --rebase origin dj_Mode || true
          git push origin dj_Mode
