name: Fix compile errors for green build
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/fix_build_compile_errors.py"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_engine_v2
          fetch-depth: 0
      - run: python3 tools/fix_build_compile_errors.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "fix: resolve profileFor + late final SFX compile errors"
          git push origin dj_engine_v2
