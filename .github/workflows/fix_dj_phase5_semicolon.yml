name: Fix DJ Phase 5 semicolon
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix_dj_phase5_semicolon.yml'
      - 'tools/fix_dj_phase5_semicolon.py'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: |
          set -euo pipefail
          python3 tools/fix_dj_phase5_semicolon.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/providers/music_provider.dart
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fix(dj): missing semicolon after Phase 5 handoff recordDj"
            git push origin HEAD:dj_Mode
          fi
