name: Apply history result hardening
on:
  push:
    branches:
      - Playback_Stability_Diagnostics
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Playback_Stability_Diagnostics
          fetch-depth: 1
      - name: Apply hardening
        run: python3 tools/harden_history_results.py
      - name: Commit fix and remove automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/providers/music_provider.dart
          git rm tools/harden_history_results.py .github/workflows/apply_history_result_hardening.yml
          git commit -m "Diagnose listening history write failures"
          git push origin Playback_Stability_Diagnostics
