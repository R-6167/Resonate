name: Apply playback responsiveness repair
on:
  push:
    branches: [Companion_Features_Diagnostics]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Companion_Features_Diagnostics
          fetch-depth: 0
      - name: Patch playback responsiveness and library scope
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/providers/music_provider.dart')
          s = p.read_text()

          old = """      final songs = await _database.getAllSongs();\n      final byId = <String, Song>{for (final song in songs) song.id: song};\n      final restored = ids.map((id) => byId[id]).whereType<Song>().toList();"""
          new = """      final songs = await _database.getAllSongs();\n      await _visibility.load();\n      final visibleSongs = _visibility.filter(songs, (song) => song.id);\n      final byId = <String, Song>{for (final song in visibleSongs) song.id: song};\n      final restored = ids.map((id) => byId[id]).whereType<Song>().toList();"""
          if old not in s:
              raise SystemExit('queue restore pattern not found')
          s = s.replace(old, new, 1)

          old = """      _crossfadeInProgress = false;\n      await _finishHistoryEvent();\n      await _stopBoth();"""
          new = """      _crossfadeInProgress = false;\n      // History persistence is already serialized. Do not make the user wait\n      // for a SQLite write before the new source starts loading. The queued\n      // finish operation completes before the subsequent history start.\n      unawaited(_finishHistoryEvent());\n      await _stopBoth();"""
          if old not in s:
              raise SystemExit('play history pattern not found')
          s = s.replace(old, new, 1)

          old = """  Future<bool> enqueueSongs(List<Song> songs) async { final additions = songs.where((s) => s.filePath.trim().isNotEmpty && !_queue.any((q) => q.id == s.id)).toList(); if (additions.isEmpty) return false;"""
          new = """  Future<bool> enqueueSongs(List<Song> songs) async { await _visibility.load(); final additions = songs.where((s) => _visibility.isVisible(s.id) && s.filePath.trim().isNotEmpty && !_queue.any((q) => q.id == s.id)).toList(); if (additions.isEmpty) return false;"""
          if old not in s:
              raise SystemExit('enqueue pattern not found')
          s = s.replace(old, new, 1)

          old = """  Future<bool> playNext(Song song) async { if (song.filePath.trim().isEmpty || currentSong?.id == song.id || _queue.any((q) => q.id == song.id)) return false;"""
          new = """  Future<bool> playNext(Song song) async { await _visibility.load(); if (!_visibility.isVisible(song.id) || song.filePath.trim().isEmpty || currentSong?.id == song.id || _queue.any((q) => q.id == song.id)) return false;"""
          if old not in s:
              raise SystemExit('playNext pattern not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

          p = Path('lib/screens/library_screen.dart')
          s = p.read_text()
          old = """    final ok = await music.playSong(song, queue: List<Song>.from(songs), startIndex: index);\n    if (!mounted) return;\n    if (ok) { await library.updatePlayCount(song.id); if (mounted) Navigator.push(context, MaterialPageRoute(builder: (_) => const PlayerScreen())); }"""
          new = """    // Start playback without making navigation wait for the full source-load\n    // and history pipeline. The player now commits the active source before\n    // its history bookkeeping finishes, so the tap feels immediate.\n    final playback = music.playSong(song, queue: List<Song>.from(songs), startIndex: index);\n    if (mounted) {\n      Navigator.push(context, MaterialPageRoute(builder: (_) => const PlayerScreen()));\n    }\n    final ok = await playback;\n    if (!mounted) return;\n    if (ok) { await library.updatePlayCount(song.id); }\n    else { ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Unable to play this song. Check that the file is still available.'))); }"""
          if old not in s:
              raise SystemExit('library tap pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('lib/screens/queue_screen.dart')
          if p.exists():
              s = p.read_text()
              # Keep queue presentation from surfacing stale restricted items if the
              # screen reads MusicProvider.queue directly; the provider is repaired
              # at restore/enqueue/next boundaries and this is a defensive UI filter.
              if 'library_visibility_store.dart' not in s and 'MusicProvider' in s:
                  s = s.replace("import '../providers/music_provider.dart';", "import '../providers/music_provider.dart';\nimport '../services/library_visibility_store.dart';", 1)
              p.write_text(s)

          Path('.github/workflows/apply_playback_responsiveness_fix.yml').unlink()
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/providers/music_provider.dart lib/screens/library_screen.dart lib/screens/queue_screen.dart .github/workflows/apply_playback_responsiveness_fix.yml
          git commit -m 'fix: make library playback responsive' || exit 0
          git push origin Companion_Features_Diagnostics
