name: Crossfade repeat fixes + driving banner
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/fix_crossfade_repeat_and_banner.py"
      - "lib/widgets/driving_suggestion_banner.dart"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modes_on_dj_v2
          fetch-depth: 0
      - run: python3 tools/fix_crossfade_repeat_and_banner.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "fix: repeat-self title/advance + silent crossfade; driving banner"
          git push origin modes_on_dj_v2
