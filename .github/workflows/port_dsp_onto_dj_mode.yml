name: Port DSP onto dj_Mode
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/port_dsp_onto_dj_mode.py'
      - '.github/workflows/port_dsp_onto_dj_mode.yml'
permissions:
  contents: write
jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 0
      - run: python3 tools/port_dsp_onto_dj_mode.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo no changes; else
            git commit -m "feat(dsp): live DSP engine on dj_Mode (fail-open A/B, EQ/preamp wire)"
            git pull --rebase origin dj_Mode
            git push origin HEAD:dj_Mode
          fi
