name: Port DSP onto dj_Mode
on:
  workflow_dispatch:
  push:
    branches: [dj_Mode]
permissions:
  contents: write
jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 0
      - name: Port DSP files from Wire_dsp_engine
        run: python3 tools/port_dsp_onto_dj_mode.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo no changes; else
            git commit -m "feat(dsp): complete live DSP port on dj_Mode (jni, patch, EQ wire)"
            git pull --rebase origin dj_Mode || true
            git push origin HEAD:dj_Mode
          fi
