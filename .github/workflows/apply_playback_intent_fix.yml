name: Apply playback intent fix

on:
  push:
    branches:
      - Playback_Stability_Diagnostics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4
        with:
          ref: Playback_Stability_Diagnostics
          fetch-depth: 1

      - name: Apply latest-user-intent playback fix
        run: python3 tools/apply_playback_intent_fix.py

      - name: Commit playback fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/providers/music_provider.dart test/playback_intent_gate_test.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix stale playback intent races"
          git push origin Playback_Stability_Diagnostics
