name: Apply EnginePair wire

on:
  workflow_dispatch:
  push:
    branches: [refactor/engine-pair]
    paths:
      - "tool/patches/engine_pair_wire.patch"
      - ".github/workflows/apply-engine-pair.yml"
      - "lib/playback/engine_pair.dart"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/engine-pair
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply wire patch
        run: |
          set -euo pipefail
          if grep -q "EnginePair _engines" lib/providers/music_provider.dart; then
            echo "Already wired"
            exit 0
          fi
          patch -p1 --batch --forward < tool/patches/engine_pair_wire.patch
          grep -q "EnginePair _engines" lib/providers/music_provider.dart
          grep -q "_engines.dispose" lib/providers/music_provider.dart
          echo "EnginePair wire applied"

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "refactor: wire MusicProvider to EnginePair"
          file_pattern: lib/providers/music_provider.dart
          branch: refactor/engine-pair
