name: Polish Settings glass
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/polish_settings_glass.py"
      - "lib/ui/resonate_glass.dart"
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 0
      - run: python3 tools/polish_settings_glass.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add lib/ui/resonate_glass.dart lib/screens/settings_screen.dart tools/polish_settings_glass.py
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "ui: glass Settings hub (shared ResonateGlass kit)"
          git pull --rebase origin dj_Mode || true
          git push origin dj_Mode
