name: Harden DJ Mode
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/harden_dj_mode.yml'
      - 'tools/harden_dj_mode.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: |
          set -euo pipefail
          python3 tools/harden_dj_mode.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/services/database_helper.dart \
                  lib/services/dj_pcm_features.dart \
                  lib/services/dj_analysis_service.dart \
                  lib/providers/music_provider.dart \
                  lib/services/dj_transition_planner.dart \
                  lib/services/dj_pcm_bpm.dart
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fix(dj): harden upsert, SFX restore, handoff cache, NaN guards"
            git push origin HEAD:dj_Mode
          fi
