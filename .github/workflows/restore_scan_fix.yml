name: Restore MainActivity scan fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore_scan_fix.yml'
      - 'tools/apply_scan_fix.py'
permissions:
  contents: write
concurrency:
  group: restore-scan-fix
  cancel-in-progress: true
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Resonate_Remake
          fetch-depth: 50
      - name: Apply scan fix
        run: |
          set -euo pipefail
          python3 tools/apply_scan_fix.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add android/app/src/main/kotlin/com/Aetherion/Resonate/MainActivity.kt lib/services/audio_file_service.dart
          git commit -m "fix: restore library scan keys + unrestricted full-library path" || true
          git push origin HEAD:Resonate_Remake
          git rm -f .github/workflows/restore_scan_fix.yml tools/apply_scan_fix.py || true
          git commit -m "chore: remove scan restore workflow" || true
          git push origin HEAD:Resonate_Remake || true
