name: Apply MainActivity native PCM
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_ma_native_pcm.yml'
      - 'tools/apply_ma_native_pcm.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - name: Apply native PCM patch
        run: |
          set -euo pipefail
          python3 tools/apply_ma_native_pcm.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add android/app/src/main/kotlin/com/Aetherion/Resonate/MainActivity.kt
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feat(dj): native MediaExtractor/MediaCodec PCM for MP3/content://"
            git push origin HEAD:dj_Mode
          fi
