name: Fix DJ SFX engaged flag
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/fix_dj_sfx_engaged_flag.py"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_engine_v2
          fetch-depth: 0
      - run: python3 tools/fix_dj_sfx_engaged_flag.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "fix(dj): mark transition SFX engaged after delayed rack apply"
          git push origin dj_engine_v2
