name: Architecture repair
on:
  push:
    branches: [Companion_Features_Diagnostics]
permissions: {contents: write}
jobs:
  repair:
    if: contains(github.event.head_commit.message, 'wire playback coordinator')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/repair_architecture_wiring.py && rm scripts/repair_architecture_wiring.py
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.2', channel: stable}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test --reporter expanded
      - run: flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with: {name: resonate-architecture-repair-apk, path: build/app/outputs/flutter-apk/app-release.apk, retention-days: 3}
      - run: |
          git config user.name 'Resonate Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair_architecture_wiring.yml
          git add lib
          git commit -m 'fix: wire playback coordinator and unified audio effects'
          git push origin Companion_Features_Diagnostics
