          s = s.replace(old, '')
          old = """                SizedBox(width: 22, height: 22, child: CircularProgressIndicator(strokeWidth: 2.2, valueColor: AlwaysStoppedAnimation(Theme.of(context).colorScheme.primary))),\n                const SizedBox(width: 12),\n"""
          new = """                const SizedBox(width: 30, height: 22, child: _LearningWaveDots()),\n                const SizedBox(width: 10),\n"""
          if old not in s: raise SystemExit('learning spinner block not found')
          s = s.replace(old, new)
          marker = "\nclass _AnticipationCard extends StatefulWidget {"
          widget = '''
class _LearningWaveDots extends StatefulWidget {
  const _LearningWaveDots();
  @override
  State<_LearningWaveDots> createState() => _LearningWaveDotsState();
}

class _LearningWaveDotsState extends State<_LearningWaveDots>
    with SingleTickerProviderStateMixin {
  late final AnimationController _controller = AnimationController(
    vsync: this,
    duration: const Duration(milliseconds: 1200),
  )..repeat();

  @override
  void dispose() {
    _controller.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    return AnimatedBuilder(
      animation: _controller,
      builder: (context, _) => Row(
        mainAxisAlignment: MainAxisAlignment.spaceBetween,
        children: List.generate(3, (index) {
          final phase = (_controller.value + index * .18) % 1.0;
          final wave = math.sin(phase * math.pi * 2);
          return Transform.translate(
            offset: Offset(0, -wave * 3.2),
            child: Transform.scale(
              scale: .72 + ((wave + 1) * .14),
              child: Container(
                width: 6,
                height: 6,
                decoration: BoxDecoration(
                  shape: BoxShape.circle,
                  color: Theme.of(context).colorScheme.primary,
                ),
              ),
            ),
          );
        }),
      ),
    );
  }
}
