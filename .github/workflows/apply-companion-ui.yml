      - name: Commit changes and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-companion-ui.yml
          git add lib/screens/home_screen.dart lib/screens/player_screen.dart lib/widgets/resonate_logo.dart lib/widgets/autopilot_takeover_card.dart .github/workflows/apply-companion-ui.yml
          git commit -m "feat: polish companion visuals and player layout"
          git push origin HEAD:Companion_Features_Diagnostics
