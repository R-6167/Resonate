name: Apply Companion UI polish
on: push

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Companion_Features_Diagnostics
          fetch-depth: 0
      - name: Apply UI patch
        run: python3 tooling/apply_companion_ui.py
      - name: Commit and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-companion-ui.yml tooling/apply_companion_ui.py
          git add lib/screens/home_screen.dart lib/screens/player_screen.dart lib/widgets/resonate_logo.dart lib/widgets/autopilot_takeover_card.dart .github/workflows/apply-companion-ui.yml tooling/apply_companion_ui.py
          git commit -m "feat: polish companion visuals and player layout"
          git push origin HEAD:Companion_Features_Diagnostics
