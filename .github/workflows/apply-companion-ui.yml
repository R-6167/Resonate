name: Apply Companion UI polish
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-companion-ui.yml'
  pull_request:
    types: [synchronize]

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Companion_Features_Diagnostics
          fetch-depth: 0
      - name: Apply UI changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('lib/widgets/resonate_logo.dart').write_text('''import 'package:flutter/material.dart';

class ResonateLogo extends StatelessWidget {
  final double size;
  const ResonateLogo({super.key, this.size = 34});

  @override
  Widget build(BuildContext context) {
    final style = Theme.of(context).textTheme.titleLarge?.copyWith(
          fontSize: size * .72,
          fontWeight: FontWeight.w900,
          fontStyle: FontStyle.italic,
          letterSpacing: -1.4,
          height: .95,
          color: Theme.of(context).colorScheme.primary,
        );
    return Text('Resonate', style: style);
  }
}
''', encoding='utf-8')

