name: Player mode shells
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/player_mode_shells.py"
jobs:
  shells:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modes_lab
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 tools/player_mode_shells.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "feat(modes): density-aware player shells (full/reduced/minimal)"
          git push origin modes_lab
