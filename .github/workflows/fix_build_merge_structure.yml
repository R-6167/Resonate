name: Fix merge structure build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix_build_merge_structure.yml'
      - 'tools/fix_build_merge_structure.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: |
          set -euo pipefail
          python3 tools/fix_build_merge_structure.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/services/dj_bpm_estimator.dart lib/services/dj_sfx_rack.dart
          if git diff --cached --quiet; then
            echo "no changes"
            grep -n "_mergeStructure" lib/services/dj_bpm_estimator.dart | head
          else
            git commit -m "fix(dj): add missing _mergeStructure and startMs.toInt()"
            git push origin HEAD:dj_Mode
          fi
