name: Apply DJ Mode Step 3
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_dj_step3.yml'
      - 'tools/apply_dj_step3.py'
permissions:
  contents: write
concurrency:
  group: apply-dj-step3
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 5
      - name: Apply tempo match to music_provider
        run: |
          set -euo pipefail
          python3 tools/apply_dj_step3.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/providers/music_provider.dart
          git commit -m "feat(dj): Step 3 tempo match during crossfade" || true
          git push origin HEAD:dj_Mode
