name: Apply BT harden skip learn
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_bt_harden_skip_learn.yml'
      - 'tools/apply_bt_harden_skip_learn.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: |
          set -euo pipefail
          python3 tools/apply_bt_harden_skip_learn.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/providers/music_provider.dart lib/services/dj_transition_memory.dart
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fix(dj): BT route recovery + weighted early-skip transition memory"
            git push origin HEAD:dj_Mode
          fi
