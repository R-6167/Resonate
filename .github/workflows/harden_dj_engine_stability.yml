name: Harden DJ engine stability
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/harden_dj_engine_stability.py"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_engine_v2
          fetch-depth: 0
      - run: python3 tools/harden_dj_engine_stability.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "harden: stuck-transition watchdog, pause cooldown, safer silent recover"
          git push origin dj_engine_v2
