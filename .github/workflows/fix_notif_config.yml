name: Fix notif config
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix_notif_config.yml'
      - 'tools/fix_notif_config.py'
permissions:
  contents: write
concurrency:
  group: fix-notif-config
  cancel-in-progress: true
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Resonate_Remake
          fetch-depth: 3
      - run: |
          set -euo pipefail
          python3 tools/fix_notif_config.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/main.dart
          git commit -m "fix: androidNotificationOngoing false (audio_service assert)" || true
          git push origin HEAD:Resonate_Remake
          git rm -f .github/workflows/fix_notif_config.yml tools/fix_notif_config.py || true
          git commit -m "chore: remove notif config fix workflow" || true
          git push origin HEAD:Resonate_Remake || true
