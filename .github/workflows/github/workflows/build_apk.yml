name: flutter-build-apk on: push: branches: - feature/playback-db workflow_dispatch: {} jobs: build: runs-on: ubuntu-latest steps: - name: Checkout uses: actions/checkout@v4 - name: Set up Flutter uses: subosito/flutter-action@v2 with: flutter-version: 'stable' - name: Install dependencies run: flutter pub get - name: Build APK (release) run: flutter build apk --release --no-shrink - name: Upload APK artifact uses: actions/upload-artifact@v4 with: name: resonate-apk path: build/app/outputs/flutter-apk/app-release.apk
