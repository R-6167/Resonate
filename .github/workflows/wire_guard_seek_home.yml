name: Wire guard seek home density
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/wire_guard_seek_home_density.py"
      - "lib/widgets/mode_guarded_action.dart"
      - "lib/widgets/mode_player_density.dart"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modes_on_dj_v2
          fetch-depth: 0
      - run: python3 tools/wire_guard_seek_home_density.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "feat(modes): two-finger guard, seek thickness, home density"
          git push origin modes_on_dj_v2
