name: Finish shelf optional features
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/finish_shelf_optional.py"
      - "lib/services/mode_shelf_builder.dart"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modes_on_dj_v2
          fetch-depth: 0
      - run: python3 tools/finish_shelf_optional.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "feat(modes): intel shelf, save playlist, library badges, DJ soft-gate"
          git push origin modes_on_dj_v2
