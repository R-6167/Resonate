name: Restore diagnostics file
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore_diagnostics.yml'
      - 'tools/apply_restore_diagnostics.py'
      - 'tools/frag_export_new.dart.txt'
      - 'tools/apply_dj_harden2.py'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 40
      - name: Restore diagnostics + harden play
        run: |
          set -euo pipefail
          python3 tools/apply_restore_diagnostics.py
          python3 tools/apply_dj_harden2.py || true
          test -f lib/services/resonate_diagnostics.dart
          grep -q 'class ResonateDiagnostics' lib/services/resonate_diagnostics.dart
          grep -q "com.aetherion.resonate/media_store" lib/services/resonate_diagnostics.dart
          grep -vq PLACEHOLDER lib/services/resonate_diagnostics.dart
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/services/resonate_diagnostics.dart lib/providers/music_provider.dart || true
          git commit -m "fix(diag): restore export channel + resilient Save As fallback" || true
          git push origin HEAD:dj_Mode
