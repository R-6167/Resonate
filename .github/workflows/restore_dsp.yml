name: Restore DSP reconnect files
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/_eq.b64'
      - 'tools/_mp.b64'
      - '.github/workflows/restore_dsp.yml'
permissions:
  contents: write
concurrency:
  group: restore-dsp
  cancel-in-progress: true
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Resonate_Remake
      - name: Decode and commit restored providers
        run: |
          set -e
          python3 - <<'PY'
          import base64, pathlib
          for src, dst in [
              ("tools/_eq.b64", "lib/providers/equalizer_provider.dart"),
              ("tools/_mp.b64", "lib/providers/music_provider.dart"),
          ]:
              data = pathlib.Path(src).read_text().strip()
              pathlib.Path(dst).write_bytes(base64.b64decode(data))
              print(dst, "bytes", pathlib.Path(dst).stat().st_size)
          PY
          # sanity: must not be PLACEHOLDER
          head -c 40 lib/providers/equalizer_provider.dart
          echo
          grep -q "AudioPipeline" lib/providers/music_provider.dart
          grep -q "onAndroidSession = (sessionId)" lib/providers/equalizer_provider.dart
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/providers/equalizer_provider.dart lib/providers/music_provider.dart
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Reconnect EQ/DSP: AudioPipeline + deferred bind + native DSP toggle"
          git push origin HEAD:Resonate_Remake
          # cleanup payload files in a follow-up commit
          git rm -f tools/_eq.b64 tools/_mp.b64 .github/workflows/restore_dsp.yml || true
          git commit -m "chore: remove DSP restore payload" || true
          git push origin HEAD:Resonate_Remake || true
