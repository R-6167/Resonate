name: Restore DSP reconnect files
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore_dsp.yml'
      - 'tools/apply_dsp_reconnect.py'
permissions:
  contents: write
concurrency:
  group: restore-dsp
  cancel-in-progress: true
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Resonate_Remake
          fetch-depth: 40
      - name: Restore and reconnect EQ/DSP
        run: |
          set -euo pipefail
          git show 397ee3b:lib/providers/equalizer_provider.dart > lib/providers/equalizer_provider.dart
          git show 397ee3b:lib/providers/music_provider.dart > lib/providers/music_provider.dart
          python3 tools/apply_dsp_reconnect.py
          head -c 60 lib/providers/equalizer_provider.dart; echo
          grep -q 'AudioPipeline(androidAudioEffects' lib/providers/music_provider.dart
          grep -q 'onAndroidSession = (sessionId)' lib/providers/equalizer_provider.dart
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/providers/equalizer_provider.dart lib/providers/music_provider.dart
          git commit -m "Reconnect EQ/DSP: AudioPipeline + deferred bind + native DSP toggle"
          git push origin HEAD:Resonate_Remake
          git rm -f .github/workflows/restore_dsp.yml tools/apply_dsp_reconnect.py tools/_eq.b64 tools/_mp.b64 2>/dev/null || true
          git commit -m "chore: remove DSP restore workflow" || true
          git push origin HEAD:Resonate_Remake || true
