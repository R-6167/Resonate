name: Apply DJ energy bridge
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_dj_energy_bridge.yml'
      - 'tools/apply_dj_energy_bridge.py'
      - 'lib/services/dj_transition_planner.dart'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: |
          set -euo pipefail
          python3 tools/apply_dj_energy_bridge.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/providers/music_provider.dart
          if git diff --cached --quiet; then
            echo "no changes"
            grep -n "_lastDjCrossfadeBiasMs\|crossfade_energy_bridge" lib/providers/music_provider.dart | head || true
          else
            git commit -m "feat(dj): apply energy-bridge bias to crossfade duration"
            git push origin HEAD:dj_Mode
          fi
