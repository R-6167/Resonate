name: Harden SFX preamp transport
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/harden_sfx_preamp_transport.py'
      - '.github/workflows/harden_sfx_preamp_transport.yml'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
          fetch-depth: 0
      - run: python3 tools/harden_sfx_preamp_transport.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo no changes; else
            git commit -m "fix: preamp, EQ category, SFX release gap, next/completion races"
            git pull --rebase origin dj_Mode
            git push origin HEAD:dj_Mode
          fi
