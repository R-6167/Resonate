name: Patch EQ Colour effects
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/patch_eq_colour_effects.py"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: python3 tools/patch_eq_colour_effects.py
      - run: |
          git config user.name "resonate-bot"
          git config user.email "bot@resonate.local"
          git add lib/screens/equalizer_screen.dart lib/screens/settings_screen.dart
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "ui: Colour effects on Equalizer (Bass/Width/Reverb), Live badge, settings cleanup"
            git push
          fi
