name: Apply DJ Phase 4 lite
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_dj_phase4_lite.yml'
      - 'tools/apply_dj_phase4_lite.py'
      - 'tools/apply_dj_phase4_estimator_patch.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: |
          set -euo pipefail
          python3 tools/apply_dj_phase4_lite.py
          python3 tools/apply_dj_phase4_estimator_patch.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/services/database_helper.dart \
                  lib/services/dj_analysis_service.dart \
                  lib/services/dj_bpm_estimator.dart
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feat(dj): Phase 4 lite — persist energy/loudness + wire estimator"
            git push origin HEAD:dj_Mode
          fi
