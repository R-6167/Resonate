name: Validate 0.1.1 patch
on:
  push:
    branches:
      - Companion_Features_Diagnostics
permissions:
  contents: write
concurrency:
  group: resonate-011-patch
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python3 scripts/apply_011_fixes.py
          rm -f scripts/apply_011_fixes.py
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'
          cache-read-only: false
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "ndk;28.2.13676358"
      - name: Create Android local.properties
        run: |
          cat > android/local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          flutter.sdk=${FLUTTER_ROOT}
          EOF
      - name: Verify Gradle
        working-directory: android
        run: gradle --version
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Analyze project
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test --reporter expanded
      - name: Build release APK
        run: |
          set -o pipefail
          rm -f build.log
          for attempt in 1 2 3; do
            echo "Gradle/Flutter build attempt $attempt/3"
            if flutter clean && flutter build apk --release --no-shrink --verbose 2>&1 | tee build.log; then exit 0; fi
            if grep -Eq '429|Too Many Requests|Could not GET|Could not HEAD|Could not resolve' build.log && [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); else exit 1; fi
          done
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: resonate-0.1.1-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
          if-no-files-found: error
      - name: Persist source changes
        if: success()
        run: |
          git config user.name 'Resonate Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib android pubspec.yaml scripts/apply_011_fixes.py
          git commit -m 'fix: stabilize playback and add configurable library scanning'
          git push origin Companion_Features_Diagnostics
