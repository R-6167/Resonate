name: Architecture repair v2
on:
  push:
    branches: [Companion_Features_Diagnostics]
permissions:
  contents: write
jobs:
  repair:
    if: contains(github.event.head_commit.message, 'architecture repair v2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply architecture wiring
        run: |
          python3 scripts/repair_architecture_wiring.py
          rm scripts/repair_architecture_wiring.py
          dart format lib/providers/music_provider.dart
          git diff --check
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android
        uses: android-actions/setup-android@v3
      - name: Install Android components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Tests
        run: flutter test --reporter expanded
      - name: Build release APK
        run: flutter build apk --release --no-shrink
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resonate-architecture-v2-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
      - name: Persist migration
        run: |
          git config user.name 'Resonate Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib
          git commit -m 'fix: wire playback coordinator and unified audio effects'
          git push origin Companion_Features_Diagnostics