name: Fix theme null
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fix_theme_null.py'
      - '.github/workflows/fix_theme_null.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dj_Mode
      - run: |
          python3 tools/fix_theme_null.py
          git config user.name "Aetherion LLC"
          git config user.email "mosesmiggs@gmail.com"
          git add lib/main.dart
          if git diff --cached --quiet; then echo no changes; else
            git commit -m "fix(ui): drop invalid filledButtonThemeData null"
            git push origin HEAD:dj_Mode
          fi
